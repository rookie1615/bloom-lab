if(tab=='fish'){const tv=S.inv.reduce((a,f)=>a+f.v,0);h+=`<h2>Backpack ${S.inv.length}/${S.cap}</h2><p>Total value ${$$(tv)}</p><button onclick="A('sa')">Sell all</button><button onclick="A('sl')">Sell Common+Uncommon</button><button onclick="A('cap')">+10 slots ${$$(capCost())}</button>`;
if(conf)h+=`<p class=w>Sell all ${S.inv.length} fish for ${$$(tv)}? <button onclick="A('sy')">Yes, sell</button><button onclick="A('nc')">Cancel</button></p>`;
h+='<div class=gr>'+(S.inv.length?S.inv.map((f,i)=>`<div class=it style="border-color:${RC[f.r]}"><img src="${ic(ALL.find(a=>a.n==f.n))}" style="${f.mu>=0?'filter:drop-shadow(0 0 5px '+MU[f.mu][2]+')':''}"><b>${(f.mu>=0?MU[f.mu][0]+' ':'')+f.n}</b><i style="color:${RC[f.r]}">${RN[f.r]}</i><span>${f.w}kg</span><button onclick="A('s',${i})">Sell ${$$(f.v)}</button></div>`).join(''):'<p>Empty. Go cast a line!</p>')+'</div>'}
else if(tab=='book'){h+=`<h2>Fish Book ${Object.keys(S.disc).length}/${ALL.length}</h2>`+L.map(l=>`<h3 style="margin-top:8px">${l.n}</h3><div class=gr>`+l.f.map(f=>{const d=S.disc[f.n];return`<div class=it style="border-color:${d?RC[f.r]:'#555'}"><img src="${ic(f)}" style="${d?'':'filter:brightness(0)'}"><b>${d?f.n:'???'}</b><i style="color:${d?RC[f.r]:'#888'}">${d?RN[f.r]:'Unknown'}</i><span>${d?'Best '+(S.best[f.n]||'?')+'kg':l.n}</span></div>`}).join('')+'</div>').join('')}
else if(tab=='map'){h+='<h2>Locations</h2>'+L.map((l,i)=>`<div class=row><p><b>${l.n}</b><br>${l.d}<br>Fish value x${l.m}</p>${S.ul[i]?(S.loc==i?'<b>HERE</b>':`<button onclick="A('go',${i})">Travel</button>`):`<button onclick="A('ul',${i})">Unlock ${$$(l.p)}</button>`}</div>`).join('')}
else if(tab=='ach'){h+=`<h2>Achievements ${Object.keys(S.ach).length}/${ACH.length}</h2>`+ACH.map(a=>`<div class=row style="${S.ach[a[0]]?'border-color:#6fd16f':''}"><p><b>${a[1]}</b><br>${a[2]}</p><b>${S.ach[a[0]]?'DONE':'Reward '+$$(a[4])}</b></div>`).join('')}
else{h+='<h2>Fishing Crew</h2>';if(!S.ul[1])h+='<p class=w>Unlock the Forest River to start hiring workers.</p>';else h+='<p>Workers fish for you and earn money, even while you are away (up to 2 hours, at half pay).</p>'+WK.map((w,i)=>{const k=S.wk[i],lm=L[S.ul[k.loc]?k.loc:0].m,pm=w[2]*(1+.5*(k.l-1))*lm;
return`<div class=row><p><b>${w[0]}</b> Lv${k.l}<br>${k.h?`Earns about ${$$(pm)}/min at ${L[k.loc].n}`:`Would earn about ${$$(w[2]*lm)}/min`}</p>${k.h?`<button onclick="A('wl',${i})">${L[k.loc].n}</button>${k.l<10?`<button onclick="A('wu',${i})">Upgrade ${$$(w[1]*.5*k.l)}</button>`:'MAX'}`:`<button onclick="A('wh',${i})">Hire ${$$(w[1])}</button>`}</div>`}).join('')}}
else if(menu=='rod')h+='<h2>Fishing Rods</h2><p>Mastery grows as you catch fish with a rod. Each level: wider reel zone and more hook time.</p>'+RD.map((r,i)=>`<div class=row><p><b style="color:${r[6]==='#303038'?'#aab':r[6]}">${r[0]}</b><br>${r[7]}<br>Holds ${r[2]}kg | Easier reel +${r[3]*100}% | Hook time +${r[4]}s | Luck +${r[5]*100}%<br>Mastery Lv${lv(S.mr[i])}/5 (${S.mr[i]} catches)</p>${S.rod==i?'<b>EQUIPPED</b>':S.rods[i]?`<button onclick="A('re',${i})">Equip</button>`:`<button onclick="A('rb',${i})">Buy ${$$(r[1])}</button>`}</div>`).join('');
else if(menu=='bait')h+='<h2>Bait Shop</h2><p>Bait is yours forever once you buy it. It changes rarity odds, never guarantees them. Your location decides which species appear. Mastery grows with use: each level makes bait stronger.</p>'+BT.map((b,i)=>`<div class=row><p><b>${b[0]}</b> ${i&&S.bs[i]?'(owned)':''}<br>${b[3]}<br>Odds: ${b[2].map((v,k)=>v!=1?RN[k]+' x'+v:'').filter(Boolean).join(', ')||'Normal'}<br>Mastery Lv${lv(S.mb[i])}/5 (${S.mb[i]} catches)</p>${S.bait==i?'<b>EQUIPPED</b>':(i==0||S.bs[i]>0)?`<button onclick="A('be',${i})">Equip</button>`:''}${i&&!S.bs[i]?`<button onclick="A('bb',${i})">Buy ${$$(b[1])}</button>`:''}</div>`).join('');
else if(menu=='set')h+=`<h2>Settings</h2><button onclick="A('snd')">Sound: ${S.snd?'ON':'OFF'}</button><button onclick="A('mus')">Music: ${S.mus?'ON':'OFF'}</button><button onclick="A('sv')">Save now</button><button onclick="A('sav')">Save / Load game</button><button onclick="A('tut')">How to play</button><p style="margin-top:8px">Auto-sell fish as you catch them (Boss fish are never auto-sold):</p>${RN.slice(0,6).map((n,i)=>`<button onclick="A('as',${i})" style="${S.as[i]?'background:#6fd16f':''}">${n}${S.as[i]?' ON':''}</button>`).join('')}<button onclick="A('asa')">All</button><button onclick="A('asn')">None</button><hr style="margin:10px 0"><button onclick="A('rs')" style="background:#c04040">Reset progress</button>${conf?'<p class=w>This erases everything. <button onclick="A(\'ry\')">Yes, erase</button><button onclick="A(\'nc\')">Cancel</button></p>':''}`;
else if(menu=='sav')h+=`<h2>Save / Load</h2><p>Copy this code or download it to keep your game safe:</p><textarea id=sc readonly rows=4 style="width:100%">${enc()}</textarea><button onclick="A('cp')">Copy code</button><button onclick="A('dl')">Download file</button><p style="margin-top:10px">Load an old game (replaces current progress). Paste a code:</p><textarea id=imp rows=4 style="width:100%"></textarea><button onclick="A('ld')">Load code</button><p style="margin-top:6px">or choose a saved file:</p><input type=file id=fl accept=".txt,.json" onchange="A('lf')">`;
else if(menu=='tut')h+='<h2>How to play</h2><p>1. Press CAST to throw your line.<br>2. When the bobber dips, press HOOK fast!<br>3. Hold the button (or Space) to move the red marker and keep it in the green zone.<br>4. Sell fish in your Backpack, then buy better rods and bait, unlock new places, and hire workers.<br>Heavier fish than your rod can hold will snap the line.</p><button onclick="A(\'x\')">Got it</button>';
m.innerHTML=h+'</div>';m.hidden=false}
const enc=()=>{sv();return btoa(unescape(encodeURIComponent(JSON.stringify(S))))};
function openChest(){const a=Math.round(L[chest.loc].m*60*(.7+R()*.8));S.m+=a;chest=null;toast('Treasure chest! It held '+$$(a)+'!','#ffd060');for(let i=0;i<30;i++)parts.push({x:160,y:150,vx:(R()-.5)*100,vy:-R()*90,l:1+R(),c:'#ffd24a'});[784,988,1175,1568].forEach((f,i)=>setTimeout(()=>tone(f,.15,'square',.05),i*90));sv();hud()}
function imp(c){try{const j=JSON.parse(decodeURIComponent(escape(atob(String(c).trim()))));if(!j||typeof j.m!='number'||!Array.isArray(j.inv))throw 0;localStorage.setItem('fishit1',JSON.stringify(j));load();menu=null;st='idle';toast('Game loaded!');hud()}catch(e){toast('That save code did not work.','#ff5080')}}
function A(a,i){const buy=(c,f)=>{if(S.m<c)return toast('Not enough money! You need '+$$(c),'#ff5080');S.m-=c;f();tone(880,.15);sv();return 1};
switch(a){case'x':menu=null;conf=0;break;case't':tab=i;conf=0;break;case'nc':conf=0;break;
case's':{const f=S.inv.splice(i,1)[0];if(f){S.m+=f.v;toast('Sold '+f.n+' for '+$$(f.v));tone(988,.1);sv()}break}
case'sa':if(S.inv.length)conf=1;else toast('Nothing to sell');break;
case'sy':{const v=S.inv.reduce((a,f)=>a+f.v,0),n=S.inv.length;S.inv=[];S.m+=v;conf=0;toast(`Sold ${n} fish for ${$$(v)}`);tone(988,.2);sv();break}
case'sl':{let v=0,n=0;S.inv=S.inv.filter(f=>f.r<=1?(v+=f.v,n++,0):1);S.m+=v;toast(n?`Sold ${n} fish for ${$$(v)}`:'No Common or Uncommon fish');tone(988,.2);sv();break}
case'cap':buy(capCost(),()=>{S.cap+=10;toast('Backpack +10 slots')});break;
case'go':S.loc=i;menu=null;toast('Welcome to '+L[i].n);break;
case'ul':buy(L[i].p,()=>{S.ul[i]=1;S.loc=i;menu=null;toast(L[i].n+' unlocked!')});break;
case'rb':buy(RD[i][1],()=>{S.rods[i]=1;S.rod=i;toast(RD[i][0]+' equipped!')});break;case're':S.rod=i;sv();break;
case'bb':if(S.bs[i])break;buy(BT[i][1],()=>{S.bs[i]=1;S.bait=i;toast(BT[i][0]+' is yours forever!')});break;case'be':S.bait=i;sv();break;
case'wh':buy(WK[i][1],()=>{S.wk[i].h=1;toast(WK[i][0]+' hired!')});break;
case'wu':buy(WK[i][1]*.5*S.wk[i].l,()=>{S.wk[i].l++});break;
case'wl':{let n=S.wk[i].loc;do n=(n+1)%3;while(!S.ul[n]);S.wk[i].loc=n;sv();break}
case'sav':menu='sav';break;case'cp':{const e=$('#sc');e.select();try{navigator.clipboard.writeText(e.value)}catch(x){document.execCommand('copy')}toast('Code copied!');break}
case'dl':{const a=document.createElement('a');a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(enc());a.download='fishit-save.txt';a.click();break}
case'ld':imp($('#imp').value);break;case'lf':{const f=$('#fl').files[0];if(f){const rd=new FileReader();rd.onload=()=>imp(rd.result);rd.readAsText(f)}break}
case'as':S.as[i]=S.as[i]?0:1;sv();break;case'asa':S.as=[1,1,1,1,1,1];sv();break;case'asn':S.as=[0,0,0,0,0,0];sv();break;
case'snd':S.snd=!S.snd;sv();break;case'mus':S.mus=!S.mus;music();sv();break;case'sv':sv();toast('Game saved');break;case'tut':menu='tut';break;case'rs':conf=1;break;
case'ry':localStorage.removeItem('fishit1');S=def();menu=null;conf=0;st='idle';toast('Progress reset');break}
mr();hud()}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{if(st=='reel'||st=='res')return;menu=b.dataset.m;tab='fish';conf=0;mr()});
const cb=$('#cb');cb.onpointerdown=e=>{e.preventDefault();act()};['pointerup','pointerleave','pointercancel'].forEach(v=>cb.addEventListener(v,()=>hold=0));
$('#c').onpointerdown=e=>{const c=$('#c'),b=c.getBoundingClientRect(),k=Math.max(b.width/320,b.height/180),px=(e.clientX-b.left-(b.width-320*k)/2)/k,py=(e.clientY-b.top-(b.height-180*k)/2)/k;if(chest&&chest.loc==S.loc&&Math.abs(px-chest.x)<14&&Math.abs(py-167)<14)return openChest();act()};$('#c').onpointerup=()=>hold=0;
addEventListener('keydown',e=>{if(e.code=='Space'&&!e.repeat&&!menu){e.preventDefault();act()}if(e.key=='Escape'&&menu)A('x')});addEventListener('keyup',e=>{if(e.code=='Space')hold=0});
$('#card').onclick=e=>{if(e.target.id=='ok'||e.target.classList.contains('ov')){$('#card').hidden=true;st='idle';cd=.5}};
addEventListener('beforeunload',sv);document.addEventListener('visibilitychange',()=>{if(document.hidden)sv()});
$('#play').onclick=()=>{try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}$('#title').hidden=true;const away=Math.min((Date.now()-S.t)/1000,7200),e=rate()*away*.5;
if(e>=1){S.m+=e;toast('Your crew earned '+$$(e)+' while you were away!')}if(!S.seen){S.seen=1;menu='tut';mr()}music();sv();hud()};
$('#lg').onclick=()=>{$('#play').onclick();menu='sav';mr()};
load();hud();requestAnimationFrame(loop);
</script></body></html>
