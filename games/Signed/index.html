<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signed: a music career game</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f0e6;--card:#fffaf0;--ink:#1d1428;--mute:#6b5f7a;--hot:#d6224f;--gold:#b97a00;--line:#d9cdb8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16101f;--card:#221a30;--ink:#f4ecff;--mute:#a597b8;--hot:#ff4d6d;--gold:#ffb703;--line:#3a2d4f}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg) fixed;color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
main{max-width:700px;margin:0 auto;padding:20px 16px 48px}
h1,h2{font-family:'Archivo Black',Impact,sans-serif;font-weight:400;margin:0 0 8px;letter-spacing:.5px}
h1{font-size:2.3rem;line-height:1.05}h2{font-size:1.2rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats b{display:block;font-family:'Archivo Black',Impact,sans-serif;font-size:1.25rem;color:var(--gold)}
.stats span{font-size:.78rem;color:var(--mute)}
label{display:block;font-size:.9rem;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
button{font:inherit;font-weight:700;padding:10px 14px;border-radius:8px;border:0;background:var(--hot);color:#fff;cursor:pointer;margin:8px 8px 0 0}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
.song{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.song:last-child{border:0}.mute{color:var(--mute);font-size:.9rem}
.rel{display:flex;gap:14px;align-items:flex-start;border:2px solid var(--gold)}.rel p{margin:3px 0}
svg.cv{border-radius:8px;flex:none;display:block}
.row{display:flex;gap:10px;align-items:center}
#log p{margin:4px 0}#log p:first-child{font-weight:700}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:16px 0 0;padding-bottom:4px}
.tab{background:transparent;color:var(--mute);border:1px solid var(--line);margin:0;flex:none}.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fresh{border-color:var(--hot)}.fresh p{margin:3px 0}
</style></head><body><main id="app"></main>
<script>
const LABELS=[
{n:"Garage Tapes",fans:60,adv:300,likes:["Punk","Lo-fi","Indie","Rock"],promo:1.5,cut:.3},
{n:"Neon Static Records",fans:300,adv:1500,likes:["Pop","Electronic","Indie"],promo:2,cut:.5},
{n:"Midnight Vinyl",fans:1000,adv:5000,likes:["Rap","R&B","Soul","Jazz"],promo:2.5,cut:.5},
{n:"Big Gold Music",fans:3000,adv:20000,likes:["Pop","Rock","Rap","Country"],promo:4,cut:.6}];
const TIERS=[["Bedroom laptop",0,0],["Home studio",120,1.5],["Pro studio",500,3.5]];
const MOODS=["Heartbreak","Party","Rebellion","Dreamy","Weird","Anthem","Rainy day"];
const GENRES=["Pop","Rap","Rock","R&B","Country","Electronic","Lo-fi","Punk","Jazz","Soul","Indie"];
const ARTISTS=[];[["Rap",["Dre Mosley","Kali Vex","Big Tambo"]],["Pop",["Juno Skye","Mila Rae","Starla Vance"]],["Rock",["Rusty Hale","The Burnouts","Axel Crowe"]],["R&B",["Nia Cole","Sade Monroe","Jericho Rae"]],["Country",["Wade Cole","Dolly Marsh","Hank Rivers"]],["Electronic",["Pixelgirl","Volt Kid","DJ Aurora"]],["Any",["Sam Parker","Lena Frost","Marcus Reed"]]].forEach(([g,ns])=>ns.forEach((n,i)=>ARTISTS.push({n,g,fame:[150,1500,8000][i],tier:["local act","rising act","star"][i]})));
const pool=()=>{const p=ARTISTS.filter(a=>a.g===S.genre);return p.length?p:ARTISTS.filter(a=>a.g==="Any")};
const V=[["Bar gig",100,150,8,40],["Club",600,600,14,250],["Theater",3000,2500,22,1500],["Arena",8000,12000,30,9000],["Stadium",15000,45000,45,40000]];
const E=[
["Dance challenge","A fan turns your old song into a dance trend.",0,["Join in",0,.15,10,0,.75],["Ignore it",0,0,0,0]],
["Hater drama","A big account roasts your last track.",0,["Clap back",0,.06,10,0,.5],["Ignore it",0,-.02,0,0]],
["Radio interview","A local station wants you on air tomorrow.",50,["Do it",0,.06,5,0],["Pass",0,0,0,0]],
["Ad sync offer","A soda brand wants your song in an ad.",300,["Take $500",500,-.03,0,0],["Decline",0,.02,3,0]],
["Gear sale","A shop is clearing out studio gear.",0,["Buy ($150)",-150,0,0,1],["Skip",0,0,0,0]],
["Fan demo","A fan sends you a surprisingly good demo.",0,["Listen",0,.02,0,1],["Skip",0,0,0,0]],
["Critic review","A critic wrote a harsh review of you.",100,["Take notes",0,0,0,1],["Rant online",0,-.05,12,0,.4]],
["Festival slot","A small festival had an artist drop out.",200,["Play ($100)",-100,.12,10,0,.7],["Pass",0,0,0,0]],
["Leaked demo","An unfinished track leaked online.",150,["Embrace it",0,.06,6,0,.7],["Takedown ($100)",-100,0,0,0]],
["Podcast invite","A popular podcast wants you as a guest.",100,["Go on",0,.07,4,0,.8],["Skip",0,0,0,0]],
["Shady promoter","A guy promises 100k followers for cash.",0,["Pay $200",-200,.2,5,0,.35],["Refuse",0,0,0,0]],
["Open mic","A packed open mic night downtown.",0,["Perform",0,.04,3,1],["Rest",0,0,-2,0]],
["Copy claim","Someone says your hook copies theirs.",300,["Settle ($200)",-200,0,0,0],["Fight it ($400)",-400,.1,10,0,.5]],
["Fan meetup","Fans want to meet you in person.",100,["Host ($80)",-80,.08,8,0],["Skip",0,0,0,0]],
["Stolen gear","Someone stole your mic.",0,["Replace ($150)",-150,0,0,0],["Use an old one",0,-.03,0,-1]],
["Streamer shoutout","A big streamer played your song live.",100,["Thank them",0,.1,6,0],["Ask for a cut",100,.01,0,0,.4]],
["Brand deal","A shoe company wants you as a face.",1000,["Take $1000",1000,-.04,-5,0],["Turn it down",0,.03,3,0]],
["Cover contest","An online contest for new artists.",0,["Enter ($30)",-30,.06,5,1,.6],["Skip",0,0,0,0]],
["Rival beef","A rival artist took a shot at you.",500,["Diss track",0,.12,15,0,.5],["Stay classy",0,.03,3,0]],
["Old song revival","An old track blows up on a meme page.",100,["Embrace it",0,.2,15,0,.7],["Ignore it",0,0,0,0]],
["Writing camp","Pro songwriters invite you to a camp.",0,["Join ($150)",-150,0,0,2],["Skip",0,0,0,0]],
["Tax bill","The tax office sends you a bill.",500,["Pay $300",-300,0,0,0],["Ignore it",0,-.05,-5,0]],
["Documentary","A crew wants to film your life.",2000,["Let them",0,.15,12,0],["Decline",0,0,0,0]],
["Charity gig","A charity asks you to play for free.",100,["Play",0,.05,6,0],["Skip",0,0,0,0]],
["Burnout","You’re exhausted and out of ideas.",0,["Rest a week",0,0,-5,0],["Push on",0,-.03,0,1]]];
const WIN=20000;
let S=null,app=document.getElementById("app");
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>Math.round(n).toLocaleString();
const sg=n=>(n<0?"−":"+")+fmt(Math.abs(n));
const stars=q=>{const n=Math.max(1,Math.min(5,Math.round(q/2)));return "★".repeat(n)+"☆".repeat(5-n)};
const hash=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))%100003;return h};
const hues=t=>{const h=hash(t);return[h%360,(h*7+90)%360]};
const K=()=>1+Math.sqrt(S.fans)/4;
function cov(t,z){const h=hash(t),[a,b]=hues(t),n=h%3,f=`hsl(${b},85%,62%)`;
const sh=n==0?`<circle cx="70" cy="58" r="${28+h%22}" fill="${f}"/>`:n==1?`<rect x="${25+h%30}" y="18" width="62" height="86" fill="${f}" transform="rotate(${h%50-25} 70 60)"/>`:`<polygon points="70,12 128,108 12,108" fill="${f}"/>`;
return `<svg class="cv" viewBox="0 0 140 140" width="${z}" height="${z}" role="img" aria-label="Cover art for ${esc(t)}"><defs><linearGradient id="g${h}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${a},70%,35%)"/><stop offset="1" stop-color="hsl(${b},70%,20%)"/></linearGradient></defs><rect width="140" height="140" fill="url(#g${h})"/>${sh}<rect y="112" width="140" height="28" fill="rgba(0,0,0,.55)"/><text x="8" y="130" fill="#fff" font-size="12" font-family="Archivo Black,Impact,sans-serif">${esc(t.slice(0,16))}</text></svg>`}
function say(t){S.log.unshift(t);S.log=S.log.slice(0,14);S.fresh.push(t)}

function start(){
app.innerHTML=`<h1>Signed</h1><p class="mute">Start in your bedroom. Write songs, drop albums, play shows, get signed.</p>
<div class="card"><label for="an">Artist name</label><input id="an" maxlength="30" placeholder="Anything you want">
<label for="gn">Your genre</label><select id="gn">${GENRES.map(g=>`<option>${g}`).join("")}</select>
<button id="go">Start my career</button></div>`;
$("go").onclick=()=>{
S={name:$("an").value.trim()||"Unknown Artist",genre:$("gn").value,week:1,cash:200,fans:0,skill:1,hype:0,songs:[],albums:[],label:null,offer:null,declined:[],log:[],since:0,over:false,ups:{},seen:[],ev:null,rel:null,bg:null,fresh:[],tab:"create"};
document.body.style.backgroundImage="none";
say("Week 1. You’ve got a laptop, $200 and a dream.");draw()}}

function fit(l){return l.likes.some(g=>g===S.genre)}
function tick(){
S.week++;let plays=0;
[...S.songs,...S.albums].forEach(s=>{s.age++;const p=Math.round(s.q*(S.fans+25)*.25/(1+s.age*.25)*(S.label?S.label.promo:1)*(1+S.hype/50)*(s.mult||1)*(S.ups.mgr?1.15:1));s.plays+=p;plays+=p});
const earn=plays*.012*(S.label?1-S.label.cut:1)+(S.ups.merch?S.fans*.015:0);S.cash+=earn;
const gain=Math.round(plays*.08);S.fans+=gain;S.hype=Math.max(0,S.hype-3);S.since++;
if(S.since>10&&S.fans>0)S.fans=Math.round(S.fans*.985);
if(plays)say(`Week ${S.week}: ${fmt(plays)} streams, +${fmt(gain)} fans, +$${fmt(earn)}.`);else say(`Week ${S.week}: quiet. Nobody’s listening yet.`);
if(S.label&&S.since>8){say(`${S.label.n} dropped you for going 8 weeks without a release.`);S.label=null}
if(!S.label&&!S.offer){const l=LABELS.find(l=>!S.declined.includes(l.n)&&S.fans>=l.fans*(fit(l)?1:1.6));
 if(l&&Math.random()<.6){S.offer=l;say(`${l.n} wants to talk.`)}}
if(!S.ev&&S.week>3&&Math.random()<.13){const ok=()=>E.map((e,i)=>i).filter(i=>E[i][2]<=S.fans);let el=ok().filter(i=>!S.seen.includes(i));if(!el.length){S.seen=[];el=ok()}
 if(el.length){const i=el[Math.floor(Math.random()*el.length)];S.seen.push(i);S.ev=E[i]}}
if(S.fans>=WIN)S.over=true}

const R={viral:["Overnight sensation. Everyone is sharing it.","The internet cannot stop playing this.","A star is born, or a fluke. Either way it’s everywhere."],flop:["A baffling misfire.","Even the fans seem confused.","Listeners are asking for their time back."],low:["Sounds rushed and thin.","Not ready yet, but there’s a spark.","Forgettable, though not awful."],mid:["Catchy and well made.","A strong step forward.","Playlist-worthy, with a few rough edges."],high:["A confident, polished record.","Instant classic energy.","Critics can’t stop praising it."]};
const rv=it=>{const a=R[it.kind||(it.q>=8?"high":it.q>=5?"mid":"low")];return a[Math.floor(Math.random()*a.length)]};
function relCard(it,type,f0,c0){it.rev=rv(it);const df=S.fans-f0,dc=Math.round(S.cash-c0);
const v=it.kind==="viral"?"It went viral!":it.kind==="flop"?"It flopped.":it.q>=8?"Critics loved it.":it.q>=5?"Solid reception.":"Mixed reviews.";
S.rel={cov:cov(it.t,150),h:esc(it.t)+(it.feat?" ft. "+esc(it.feat):""),lines:[`${type}, ${stars(it.q)}`,`<b>${v}</b>`,`<i>“${it.rev}” (Static Weekly)</i>`,`Quality ${it.q}`,`First-week streams: ${fmt(it.plays)}`,`Fans: ${sg(df)}`,`Cash: ${dc<0?"−":"+"}$${fmt(Math.abs(dc))}`]};
S.bg=hues(it.t)}

function write(collab){S.fresh=[];
const t=$("st").value.trim();if(!t){$("st").focus();return}
const tier=TIERS[$("ti").value],mood=$("mo").value;
if(S.cash<tier[1])return;
let a=null;
if(collab){a=ARTISTS.find(x=>x.n===$("co").value);
 const r=S.fans/a.fame,ch=Math.min(.9,r<.3?.02:.2+r*.4+(S.label?0.15:0)),fee=Math.round(a.fame*.2+50);
 if(Math.random()>ch){say(`${a.n}’s team passed: “who is this?” You wait a week for nothing.`);tick();draw();return}
 if(S.cash<tier[1]+fee){say(`${a.n} said yes, but you can’t cover the $${fmt(fee)} fee.`);draw();return}
 S.cash-=fee}
S.cash-=tier[1];
const q=Math.max(1,Math.round((S.skill*1.2+tier[2]+(S.ups.gear?1.5:0)+Math.random()*4+(a?Math.min(6,2+a.fame/1500):0))*10)/10);
const s={t,mood,q,plays:0,age:0,mult:a?1.5:1,feat:a?a.n:""};
const f0=S.fans,c0=S.cash;
if(Math.random()<.05+q*.01+S.hype*.002+(a?0.05:0)){s.kind="viral";s.mult*=6;S.fans+=Math.round((S.fans+50)*.4)}
else if(Math.random()<(q<4?.5:.06)*(S.ups.mgr?.5:1)){s.kind="flop";s.mult=.2;S.fans-=Math.min(S.fans,Math.round(S.fans*(.08+Math.random()*.1)))}
S.songs.push(s);S.since=0;tick();relCard(s,"Single",f0,c0);draw()}

function album(){S.fresh=[];
const t=$("al").value.trim(),av=S.songs.filter(s=>!s.alb);
if(!t){$("al").focus();return}if(av.length<4||S.cash<200)return;
S.cash-=200;const use=av.sort((a,b)=>b.q-a.q).slice(0,10);use.forEach(s=>s.alb=1);
const q=Math.round((use.reduce((x,s)=>x+s.q,0)/use.length+S.skill*.3+1)*10)/10;
const al={t,q,plays:0,age:0,mult:2.5};const f0=S.fans,c0=S.cash;
if(Math.random()<.05+q*.012+S.hype*.002){al.kind="viral";al.mult=8;S.fans+=Math.round((S.fans+50)*.3)}
else if(Math.random()<(q<4?.5:.05)*(S.ups.mgr?.5:1)){al.kind="flop";al.mult=.3;S.fans-=Math.round(S.fans*.12)}
S.cash+=Math.round(q*(S.fans+30)*.06);S.albums.push(al);S.since=0;tick();
relCard(al,`Album, ${use.length} tracks`,f0,c0);S.rel.lines.splice(2,0,`Critic score: ${Math.max(10,Math.min(99,Math.round(q*10)))}/100`);draw()}

function gig(i){S.fresh=[];const v=V[i];if(S.fans<v[1]||S.cash<v[4])return;S.cash-=v[4];
const att=Math.round(Math.min(v[2],S.fans*(.1+Math.random()*.25)*(1+S.hype/80)));
const sk=S.skill*1.3+Math.random()*6+S.hype/10,need=i*3+3,gf=sk>need+3?.12:sk<need-1?-.1:.03;
const rev=Math.round(att*v[3]),df=Math.round(S.fans*gf);S.cash+=rev;S.fans=Math.max(0,S.fans+df);S.hype+=gf>.1?10:0;
const verdict=gf>.1?"A legendary night. People will talk about it.":gf<0?"Rough show. Sound problems and a flat crowd.":"A solid show. The crowd had fun.";
S.rel={cov:"",h:v[0],lines:[`<b>${verdict}</b>`,`Attendance: ${fmt(att)} of ${fmt(v[2])}`,`Ticket sales: $${fmt(rev)} (costs $${fmt(v[4])})`,`Fans: ${sg(df)}`]};
say(`You played the ${v[0].toLowerCase()}.`);tick();draw()}

function act(a){
let w=true;S.fresh=[];
if(a==="prac"){S.skill++;say("You practiced all week. Skill goes up.")}
else if(a==="promo"&&S.cash>=60){S.cash-=60;S.hype+=15;say("Posters and ads are up. Buzz is rising.")}
else if(a==="vid"&&S.cash>=350){S.cash-=350;S.hype+=30;say("Your music video dropped. Big buzz.")}
else if(a==="live"){const g=Math.max(3,Math.round(S.fans*.03*(1+Math.random())));S.fans+=g;S.hype+=3;say(`You went live for fans. +${fmt(g)} fans.`)}
else if(a==="busk"){const g=Math.round(3+Math.random()*10),m=Math.round(10+Math.random()*30);S.fans+=g;S.cash+=m;say(`Busking: +${g} fans, +$${m} in tips.`)}
else if(a==="mgr"&&S.cash>=400){S.cash-=400;S.ups.mgr=1;say("You hired a manager. Fewer flops, more streams.");w=false}
else if(a==="merch"&&S.cash>=250){S.cash-=250;S.ups.merch=1;say("Your merch store is open. Passive income every week.");w=false}
else if(a==="gear"&&S.cash>=600){S.cash-=600;S.ups.gear=1;say("New gear. Every song sounds better.");w=false}
else if(a==="yes"){const l=S.offer;S.label=l;S.cash+=l.adv;S.offer=null;S.since=0;say(`Signed with ${l.n}! $${fmt(l.adv)} advance. They take ${l.cut*100}% of earnings.`);w=false}
else if(a==="no"){S.declined.push(S.offer.n);say(`You turned down ${S.offer.n}.`);S.offer=null;w=false}
else if(a==="rename"){const g=$("ng").value;if(g!==S.genre){S.genre=g;S.fans=Math.round(S.fans*.8);say(`You switched to ${g}. Some old fans didn’t follow (−20%).`)}w=false}
else if(a==="wait"){say("You laid low for a week and let your music stream.")}
else if(a==="ok"){S.rel=null;w=false}
else if(a[0]==="g"){gig(+a[1]);return}
else if(a[0]==="e"){const e=S.ev,o=e[3+ +a[1]],p=o[5]===undefined?1:o[5],g=Math.random()<p?1:-1;
 let c=o[1]>0?Math.round(o[1]*K())*g:o[1];const f=Math.round((S.fans+20)*o[2]*g),h=o[3]*g,s=g>0?o[4]:0;
 S.cash=Math.max(0,S.cash+c);S.fans=Math.max(0,S.fans+f);S.hype=Math.max(0,S.hype+h);S.skill=Math.max(1,S.skill+s);
 const b=[c&&`${c<0?"−":"+"}$${fmt(Math.abs(c))}`,f&&`${sg(f)} fans`,h&&`${h<0?"−":"+"}${Math.abs(h)} buzz`,s&&`${s<0?"−":"+"}${Math.abs(s)} skill`].filter(Boolean).join(", ");
 say(`${e[0]}: ${o[0]}. ${p<1?(g>0?"It worked. ":"It backfired. "):""}${b}`);S.ev=null;w=false}
if(w)tick();draw()}

function draw(){
if(S.over){const top=[...S.songs,...S.albums].sort((a,b)=>b.plays-a.plays)[0];
app.innerHTML=`<h1>You made it.</h1><div class="card"><p>${esc(S.name)} hit ${fmt(S.fans)} fans in ${S.week} weeks, making ${esc(S.genre)}.</p><p>Biggest release: <b>${top?esc(top.t):"none"}</b>. ${S.songs.length} singles, ${S.albums.length} albums.</p><button id="ag">Play again</button></div>`;$("ag").onclick=start;return}
const o=S.offer,e=S.ev,r=S.rel,av=S.songs.filter(s=>!s.alb).length,T=S.tab,all=[...S.songs,...S.albums];
document.body.style.backgroundImage=S.bg?`linear-gradient(160deg,hsla(${S.bg[0]},70%,50%,.3),hsla(${S.bg[1]},70%,40%,.2))`:"none";
const up=(k,n,c,d)=>`<div class="song"><span>${n} <span class="mute">${d}</span></span>${S.ups[k]?`<span class="mute">Owned</span>`:`<button class="alt" data-a="${k}" ${S.cash<c?"disabled":""}>$${fmt(c)}</button>`}</div>`;
const ent=(s,k)=>`<div class="song"><span class="row">${cov(s.t,56)}<span>${esc(s.t)}${s.feat?" ft. "+esc(s.feat):""}<br><span class="mute">${k}, ${stars(s.q)}${s.mood?", "+s.mood:""}${s.kind?", "+(s.kind==="viral"?"Viral":"Flop"):""}</span>${s.rev?`<br><i class="mute">“${s.rev}”</i>`:""}</span></span><span class="mute">${fmt(s.plays)} streams</span></div>`;
const P={
create:`<div class="card"><h2>Write a song</h2>
<label for="st">Song title</label><input id="st" maxlength="40" placeholder="Name it anything">
<label for="mo">Vibe</label><select id="mo">${MOODS.map(m=>`<option>${m}`).join("")}</select>
<label for="ti">Where do you record?</label><select id="ti">${TIERS.map((t,i)=>`<option value="${i}" ${S.cash<t[1]?"disabled":""}>${t[0]} ($${t[1]})`).join("")}</select>
<button id="wr">Record and release</button>
<label for="co">Or ask someone to feature</label><select id="co">${pool().map(a=>`<option value="${a.n}">${a.n} (${a.tier})`).join("")}</select>
<p class="mute">Bigger names cost more and only say yes if you’re known. A feature boosts quality and streams.</p><button class="alt" id="cb">Ask for a feature</button></div>
<div class="card"><h2>Album</h2><p class="mute">Bundles your best unreleased singles (${av} ready, need 4). Costs $200 to master and design.</p>
<label for="al">Album title</label><input id="al" maxlength="40" placeholder="Name your album"><button id="ab" ${av<4||S.cash<200?"disabled":""}>Release album</button></div>`,
music:`<div class="card"><h2>Your music</h2><p class="mute">${fmt(all.reduce((x,s)=>x+s.plays,0))} total streams, ${S.albums.length} albums, ${S.songs.length} singles</p></div>${all.length?`<div class="card"><h2>Albums</h2>${S.albums.length?[...S.albums].reverse().map(s=>ent(s,"Album")).join(""):`<p class="mute">No albums yet. Make one in the Create tab.</p>`}</div><div class="card"><h2>Singles</h2>${S.songs.length?[...S.songs].reverse().map(s=>ent(s,"Single")).join(""):`<p class="mute">No singles yet.</p>`}</div>`:`<div class="card"><p>Nothing released yet. Head to the Create tab.</p></div>`}`,
shows:`<div class="card"><h2>Concerts</h2><p class="mute">Bigger venues unlock as your fanbase grows. Each show takes a week.</p>${V.map((v,i)=>`<div class="song"><span>${v[0]} <span class="mute">${fmt(v[2])} seats, $${v[3]} tickets</span></span>${S.fans<v[1]?`<span class="mute">Need ${fmt(v[1])} fans</span>`:`<button class="alt" data-a="g${i}" ${S.cash<v[4]?"disabled":""}>Book ($${fmt(v[4])})</button>`}</div>`).join("")}</div>`,
career:`<div class="card"><h2>Build your career</h2><p class="mute">Each of these takes a week.</p><button class="alt" data-a="prac">Practice (+1 skill)</button><button class="alt" data-a="promo" ${S.cash<60?"disabled":""}>Promote ($60)</button><button class="alt" data-a="vid" ${S.cash<350?"disabled":""}>Music video ($350)</button><button class="alt" data-a="live">Livestream</button>${S.fans<300?`<button class="alt" data-a="busk">Busk on the street</button>`:""}<button class="alt" data-a="wait">Wait a week</button>
<div class="row"><select id="ng" style="width:auto">${GENRES.map(g=>`<option ${g===S.genre?"selected":""}>${g}`).join("")}</select><button class="alt" data-a="rename">Switch genre</button></div></div>
<div class="card"><h2>Upgrades</h2>${up("mgr","Manager",400,"fewer flops, more streams")}${up("merch","Merch store",250,"weekly income from fans")}${up("gear","Better gear",600,"higher song quality")}</div>`,
news:`<div class="card" id="log"><h2>News</h2>${S.log.map(l=>`<p>${l}</p>`).join("")}</div>`};
app.innerHTML=`<h1>${esc(S.name)}</h1><p class="mute">${esc(S.genre)}, ${S.label?"signed to "+S.label.n:"independent"}, week ${S.week}</p>
<div class="card stats"><div><b>$${fmt(S.cash)}</b><span>Cash</span></div><div><b>${fmt(S.fans)}</b><span>Fans (goal ${fmt(WIN)})</span></div><div><b>${S.skill}</b><span>Skill</span></div><div><b>${S.hype}</b><span>Buzz</span></div></div>
${S.fresh.length?`<div class="card fresh" role="status">${S.fresh.map(l=>`<p>${l}</p>`).join("")}</div>`:""}
${r?`<div class="card rel">${r.cov}<div><h2>${r.h}</h2>${r.lines.map(l=>`<p>${l}</p>`).join("")}<button data-a="ok">Continue</button></div></div>`:""}
${e?`<div class="card"><h2>${e[0]}</h2><p>${e[1]}</p>${[3,4].map((k,i)=>`<button ${i?'class="alt"':""} data-a="e${i}" ${e[k][1]<0&&S.cash<-e[k][1]?"disabled":""}>${e[k][0]}</button>`).join("")}</div>`:""}
${o?`<div class="card"><h2>${o.n} wants to sign you</h2><p>Advance: <b>$${fmt(o.adv)}</b>. They take ${o.cut*100}% and boost your reach ×${o.promo}. You must release something at least every 8 weeks.</p><p class="mute">${fit(o)?"They love your sound.":"Your genre isn’t their usual thing, but they like your numbers."}</p><button data-a="yes">Sign the deal</button><button class="alt" data-a="no">Not interested</button></div>`:""}
<div class="tabs" role="tablist">${[["create","Create"],["music","Music"],["shows","Shows"],["career","Career"],["news","News"]].map(([k,n])=>`<button role="tab" aria-selected="${k===T}" class="tab${k===T?" on":""}" data-t="${k}">${n}${k==="music"&&all.length?` (${all.length})`:""}</button>`).join("")}</div>
${P[T]}`;
if($("wr")){$("wr").onclick=()=>write(false);$("cb").onclick=()=>write(true);$("ab").onclick=album}
app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>act(b.dataset.a));
app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;S.fresh=[];draw()});
scrollTo(0,0)}
start();
</script></body></html>
