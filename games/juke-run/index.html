<title>Juke Run</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Graduate&family=Barlow+Condensed:wght@500;700&display=swap">
<style>
/* Layout: one-screen app — scoreboard strip, field canvas, control bar (joystick left, sound middle, juke right). Single night-stadium look by choice. */
:root{
  --turf:#1f5a32; --turf-dark:#1a4e2b; --chalk:#f2f5ee; --board:#101614; --panel:#0a0e0c; --line:#26322c;
  --amber:#ffb627; --jersey:#d6453d; --muted:#9fb3a6;
  --display:"Graduate", "Rockwell", Georgia, serif;
  --body:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--board);color:var(--chalk);font-family:var(--body);overflow:hidden;box-sizing:border-box;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select:none;user-select:none}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-block:8px;box-sizing:border-box}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:6px}
.cell{display:flex;flex-direction:column;align-items:center;gap:1px}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.val{font-family:var(--display);font-size:20px;color:var(--amber);font-variant-numeric:tabular-nums;text-shadow:0 0 8px rgba(255,182,39,.45)}
.stage{position:relative;flex:1;min-height:0;border-radius:6px;overflow:hidden;border:2px solid var(--line)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.app{position:relative}
.overlay{position:absolute;inset:0;z-index:5;background:rgba(10,14,12,.94);overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:6px}
.overlay[hidden],.home[hidden],.gameover[hidden],.editor[hidden],.legend[hidden]{display:none!important}
.kickmode .joy{visibility:hidden}
.home,.gameover{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:18px 4px}
.sect{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber)}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;width:100%;max-width:470px}
.skin{display:grid;grid-template-columns:56px 1fr;align-items:center;gap:8px;text-align:left;background:#141c19;border:2px solid var(--line);border-radius:6px;padding:6px;cursor:pointer;color:var(--chalk);font-family:var(--body)}
.skin[aria-pressed="true"]{border-color:var(--amber);background:#1d241a}
.skin:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
.skin canvas{width:56px;height:56px}
.skin strong{display:block;font-size:17px;line-height:1.05}
.skin small{display:block;font-size:13px;color:var(--muted);line-height:1.15}
.editor{display:grid;gap:8px;width:100%;max-width:470px;background:#141c19;border:1px solid var(--line);border-radius:6px;padding:10px;box-sizing:border-box}
.row{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:8px;text-align:left}
.row label,.row .lab{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.row input{font-family:var(--display);font-size:18px;background:#0a0e0c;color:var(--chalk);border:1px solid var(--line);border-radius:4px;padding:6px 8px;text-transform:uppercase;min-width:0}
.row input:focus{outline:2px solid var(--amber)}
.sw{display:flex;flex-wrap:wrap;gap:6px}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{border-color:var(--chalk);box-shadow:0 0 0 2px var(--amber)}
.back{width:120px;height:120px}
.bld{display:flex;gap:6px;flex-wrap:wrap}.bld button{font-family:var(--body);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:4px;border:1px solid var(--line);background:#0a0e0c;color:var(--muted);cursor:pointer}.bld button[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
.err{font-size:14px;color:#ff5a4e;max-width:34ch}
#go{position:sticky;bottom:10px;box-shadow:0 6px 18px rgba(0,0,0,.6)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:0;width:100%;max-width:470px;border:2px solid var(--line);border-radius:6px;overflow:hidden}
.modes button{font-family:var(--display);font-size:16px;padding:10px 6px;border:0;background:#141c19;color:var(--muted);cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--amber);color:#1a1205}
.modes button:focus-visible{outline:3px solid var(--chalk);outline-offset:-3px}
.ghost{font-family:var(--body);font-weight:700;font-size:16px;letter-spacing:.1em;text-transform:uppercase;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:8px 18px;cursor:pointer}
@media (max-height:620px){.overlay p{font-size:15px}.legend{font-size:13px}.overlay h1{font-size:30px}.hint{display:none}}
.overlay h1{font-family:var(--display);font-size:clamp(34px,10vw,52px);margin:0;line-height:1;color:var(--chalk)}
.overlay h1 span{color:var(--amber)}
.overlay p{margin:0;font-size:18px;color:var(--muted);max-width:32ch}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:15px;color:var(--chalk);max-width:34ch}
.legend b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:11px;color:#0a0e0c;margin-right:4px;vertical-align:middle}
.btn{font-family:var(--display);font-size:20px;background:var(--amber);color:#1a1205;border:0;border-radius:4px;padding:12px 28px;cursor:pointer}
.btn:focus-visible,.juke:focus-visible,.mute:focus-visible{outline:3px solid var(--chalk);outline-offset:3px}
.hint{font-size:14px;color:var(--muted);letter-spacing:.06em}
.controls{height:128px;flex:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-inline:6px;touch-action:none}
.joy{width:116px;height:116px;flex:none;border-radius:50%;background:radial-gradient(circle,#1a2420 0 55%,#141c19 56%);border:2px solid var(--line);position:relative;touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:var(--chalk);box-shadow:0 3px 0 #9aa79f;will-change:transform}
.mid{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.mute{white-space:nowrap}
@media (max-width:400px){.joy{width:100px!important;height:100px!important}.juke{width:90px!important;height:90px!important;font-size:18px!important}.jump{width:62px!important;height:62px!important;font-size:13px!important}.controls{padding-inline:0!important}}
.minis{display:flex;gap:6px;align-items:center}
.pz{width:34px;height:30px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-family:var(--body);font-weight:700;font-size:14px;cursor:pointer;padding:0}
.pz:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
.pause{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(10,14,12,.78)}
.pause[hidden]{display:none!important}
.pause h2{font-family:var(--display);font-size:38px;margin:0;color:var(--chalk);font-weight:400}
.modes small{display:block;font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:.08em;opacity:.75;margin-top:2px}
.jump{--cd:1;width:72px;height:72px;border-radius:50%;border:0;cursor:pointer;touch-action:none;font-family:var(--display);font-size:15px;color:#06222e;
  background:conic-gradient(#4fc3f7 calc(var(--cd)*360deg),#1d3540 0);box-shadow:0 4px 0 #1f6f8f}
.jump:active{transform:translateY(2px);box-shadow:0 2px 0 #1f6f8f}
.jump.cool{color:#5f8796}
.jump:focus-visible{outline:3px solid var(--chalk);outline-offset:3px}
.mute{font-family:var(--body);font-weight:700;font-size:13px;letter-spacing:.12em;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.juke{--cd:1;width:104px;height:104px;flex:none;border-radius:50%;border:0;cursor:pointer;touch-action:none;font-family:var(--display);font-size:20px;color:#1a1205;
  background:conic-gradient(var(--amber) calc(var(--cd)*360deg),#3a3220 0);box-shadow:0 4px 0 #8a6210}
.juke.cool{color:#8a7a55}
.juke:active{transform:translateY(2px);box-shadow:0 2px 0 #8a6210}
</style>

<div class="app">
  <div class="board">
    <div class="cell"><span class="lbl">Score</span><span class="val" id="score">0</span></div>
    <div class="cell"><span class="lbl" id="lbl2">To go</span><span class="val" id="togo">100</span></div>
    <div class="cell"><span class="lbl" id="lbl3">Qtr</span><span class="val" id="qtr">1</span></div>
    <div class="cell"><span class="lbl">Best</span><span class="val" id="best">0</span></div>
  </div>
  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div class="pause" id="pauseScr" hidden><h2>PAUSED</h2><button class="btn" id="resume" type="button">Resume</button><button class="ghost" id="pMenu" type="button">Menu</button></div>
  </div>
  <div class="overlay" id="overlay">
    <div class="home" id="home">
      <h1>JUKE <span>RUN</span></h1>
      <div class="modes" role="group" aria-label="Game mode">
        <button type="button" id="modeRun">Field Goal<small id="bRun"></small></button>
        <button type="button" id="modeRush">Juke Run<small id="bRush"></small></button>
        <button type="button" id="modeCatch">Catch Mode<small id="bCatch"></small></button>
        <button type="button" id="modeDef">Defense<small id="bDef"></small></button>
      </div>
      <p id="modeBlurb"></p>
      <span class="sect" id="pickLbl">Pick your player</span>
      <div class="skins" id="skins"></div>
      <div class="editor" id="editor" hidden>
        <div class="row">
          <label for="cName">Name on back</label>
          <input id="cName" maxlength="10" autocomplete="off" spellcheck="false">
        </div>
        <div class="row">
          <label for="cNum">Number</label>
          <input id="cNum" inputmode="numeric" maxlength="2" autocomplete="off">
        </div>
        <div class="row"><span class="lab">Jersey</span><div class="sw" id="swJersey"></div></div>
        <div class="row"><span class="lab">Trim</span><div class="sw" id="swTrim"></div></div>
        <div class="row"><span class="lab">Build</span><div class="bld" id="swBuild"></div></div>
      </div>
      <div class="legend" id="legend">
        <span><b style="background:#4fc3f7">SPD</b>Speed burst</span>
        <span><b style="background:#c9d4cc">PAD</b>Survive a hit</span>
        <span><b style="background:#ffb627">2X</b>Double points</span>
      </div>
      <button class="btn" id="go" type="button">Kick off</button>
      <span class="err" id="err" hidden></span>
      <span class="hint">Field Goal: tap the field or the big button · Other modes: stick to move · Desktop: WASD/arrows + Space, J to jump, P to pause</span>
    </div>
    <div class="gameover" id="gameover" hidden>
      <h1 id="goTitle">TACKLED</h1>
      <canvas class="back" id="goBack" width="160" height="160"></canvas>
      <p id="msg"></p>
      <button class="btn" id="again" type="button">Run it back</button>
      <button class="ghost" id="change" type="button">Menu</button>
    </div>
  </div>
  <div class="controls">
    <div class="joy" id="joy" aria-label="Joystick"><div class="knob" id="knob"></div></div>
    <div class="mid"><button class="jump" id="jumpBtn" type="button">JUMP</button><div class="minis"><button class="pz" id="pauseBtn" type="button" aria-label="Pause">II</button><button class="mute" id="mute" type="button">SOUND ON</button></div></div>
    <button class="juke" id="jukeBtn" type="button">JUKE</button>
  </div>
</div>

<script>
// show any script error on the start screen instead of failing silently
window.addEventListener('error',e=>{const el=document.getElementById('err');if(el){el.hidden=false;el.textContent='Error: '+(e.message||e)}});
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
const $=id=>document.getElementById(id);
let W,H,dpr;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=stage.clientWidth;H=stage.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

let mode='run';try{mode=localStorage.getItem('jukeMode')||'run'}catch(e){}
const BEST_KEY=()=>mode==='rush'?'jukeBest':mode==='catch'?'catchBest':mode==='defense'?'defBest':'kickBest';
let best=0;function loadBest(){best=0;try{best=+localStorage.getItem(BEST_KEY())||0}catch(e){}$('best').textContent=best}
loadBest();
const BLURB={rush:'Straight rushing play, no catches. Push up to run, juke defenders as they lunge, break ankles on the lungers, or JUMP to hurdle them for +3. Grab power-ups and take it to the house. One tackle ends it.',run:'You\'re the kicker. Tap to lock aim, tap again for power, before the rush gets there. Fight the wind, rain and snow, angle it from the hash, and thread the gold ring for +5. Every 5th kick is a game winner worth double. Miss 3 and you\'re cut.',
  catch:'Your QB airs it out. Get under the marker before it lands, and hit JUMP as it arrives to high-point it over defenders (no one can tackle you in the air). Catch it and the end zone shows up 50 yards away, so take it to the house. 3 incompletions and the drive is over.',
  defense:'You\'re on D. Run into the ball carrier or time a DIVE to tackle. A gold ring means he still has a cut ready, so bait it, then dive. Sack the QB before he throws, or JUMP at the red marker as the ball arrives to pick it off. Give up 3 TDs and you\'re done.'};
function syncMode(){$('modeRun').setAttribute('aria-pressed',String(mode==='run'));$('modeRush').setAttribute('aria-pressed',String(mode==='rush'));$('modeCatch').setAttribute('aria-pressed',String(mode==='catch'));$('modeDef').setAttribute('aria-pressed',String(mode==='defense'));
  $('modeBlurb').textContent=BLURB[mode];loadBest();
  const g=k=>{try{return +localStorage.getItem(k)||0}catch(e){return 0}};
  $('bRun').textContent='Best '+g('kickBest');$('bRush').textContent='Best '+g('jukeBest');$('legend').hidden=mode!=='catch'&&mode!=='rush';$('pickLbl').textContent=mode==='run'?'Pick your kicker':mode==='rush'?'Pick your runner':mode==='catch'?'Pick your receiver':'Pick your defender';$('bCatch').textContent='Best '+g('catchBest');$('bDef').textContent='Best '+g('defBest')}
$('modeRun').onclick=()=>{mode='run';try{localStorage.setItem('jukeMode',mode)}catch(e){}syncMode();buildHome()};
$('modeDef').onclick=()=>{mode='defense';try{localStorage.setItem('jukeMode',mode)}catch(e){}syncMode();buildHome()};
$('modeRush').onclick=()=>{mode='rush';try{localStorage.setItem('jukeMode',mode)}catch(e){}syncMode();buildHome()};
$('modeCatch').onclick=()=>{mode='catch';try{localStorage.setItem('jukeMode',mode)}catch(e){}syncMode();buildHome()};
syncMode();

// ---------- sound (Web Audio, starts on Kick off tap) ----------
let AC=null,muted=false;try{muted=localStorage.getItem('jukeMute')==='1'}catch(e){}
function syncMute(){$('mute').textContent=muted?'MUTED':'SOUND'}syncMute();
$('mute').onclick=()=>{muted=!muted;syncMute();try{localStorage.setItem('jukeMute',muted?'1':'0')}catch(e){}};
function tone(f,dur,type='square',vol=.06,slide=1,delay=0){if(!AC||muted)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide!==1)o.frequency.exponentialRampToValueAtTime(f*slide,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02)}
function noise(dur,vol){if(!AC||muted)return;const n=AC.sampleRate*dur,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=b;f.type='lowpass';f.frequency.value=900;g.gain.value=vol;s.connect(f).connect(g).connect(AC.destination);s.start()}
const sfx={
  juke:()=>{buzz(15);tone(480,.12,'square',.05,1.9);noise(.08,.12)},
  ankles:()=>{buzz([20,30,40]);tone(392,.09,'square',.06);tone(784,.2,'square',.06,1.4,.07);noise(.12,.15)},
  whiff:()=>tone(180,.16,'sawtooth',.035,.6),
  tackle:()=>{buzz(120);noise(.4,.5);tone(110,.35,'sine',.3,.4)},
  pad:()=>{noise(.2,.3);tone(260,.22,'triangle',.1,2.2)},
  td:()=>(buzz([40,40,40,40,80]),0)||[523,659,784,1047,1319].forEach((f,i)=>tone(f,.24,'square',.05,1,i*.09)),
  pick:()=>{tone(880,.08,'triangle',.08);tone(1320,.14,'triangle',.08,1,.07)},
  warn:()=>tone(1400,.04,'square',.015),
  throw:()=>{noise(.18,.12);tone(300,.25,'triangle',.04,2.2)},
  catchIt:()=>{buzz(25);tone(660,.08,'square',.06);tone(990,.16,'square',.06,1.2,.07);noise(.06,.2)}
};

// ---------- catch mode: QB throws to a marked spot ----------
const QBY=()=>H*.97;
const yardToY=L=>PY0()-(L-st.yards)*PPY();
const goalYard=()=>st.mode==='catch'?(st.hasBall?st.ezYard:null):100;
function throwPass(){
  const ppy=PPY(),py0=PY0();
  const d=15+Math.random()*16+Math.min(st.qtr*1.5,8);
  // timed so running full speed puts you right under it near your normal spot
  const yLand=py0+H*(Math.random()*.05);
  const T=Math.max(1.3,(d+(yLand-py0)/ppy)/(st.fwd*.97));
  const tx=W*(.1+Math.random()*.8);
  const p={sx:W/2,sy:st.yards+(py0-QBY())/ppy,tx,ty:st.yards+d,T,t:0,d:Math.round(d),peak:3+d*.15};
  // the closest defender ahead of the spot tries to jump the route
  let cov=null,cd=1e9;for(const o of st.defs){const dd=Math.hypot(o.x-tx,o.y-yardToY(p.ty));if(dd<cd){cd=dd;cov=o}}
  p.cov=cov;st.pass=p;st.qbT=.35;sfx.throw();
}
function passPos(p,u){const gx=p.sx+(p.tx-p.sx)*u,gy=p.sy+(p.ty-p.sy)*u,h=4*p.peak*u*(1-u);
  const y=yardToY(gy);return{gx,gy:y,x:gx,y:y-h*PPY()*.55,h}}
function resolvePass(){
  const p=st.pass,pr=PR(),tX=p.tx,tY=yardToY(p.ty),reach=pr*2.6*st.hands;
  const pd=Math.hypot(st.x-tX,st.y-tY);
  let dd=1e9,dn=null;for(const o of st.defs){const v=Math.hypot(o.x-tX,o.y-tY);if(v<dd){dd=v;dn=o}}
  st.pass=null;st.passT=1.1+Math.random()*1.3;
  const air=st.jumpT>0,R2=reach*(air?1.5:1);
  if(pd<R2&&(air||!(dd<pd&&dd<reach*.8))){
    const contested=air&&dd<reach;st.catches++;st.streak++;st.catchYds+=p.d;st.hasBall=true;st.ezYard=Math.round(st.yards)+50;
    const pts=(3+Math.floor(p.d/6)+(st.streak-1)+(air?2:0)+(contested?3:0))*(st.x2>0?2:1);st.score+=pts;
    pop(tX,tY-pr,`${contested?'CONTESTED ':air?'JUMPING ':''}CATCH ${p.d} YDS +${pts}`+(st.streak>1?`  x${st.streak}`:''),'#ffb627');
    burstParts(tX,tY,14,['#ffb627','#f2f5ee','#6b3a1d']);sfx.catchIt();st.shake=.2;return false}
  st.streak=0;st.drops++;
  if(dd<reach){pop(tX,tY-pr,'BROKEN UP','#ff5a4e');burstParts(tX,tY,8,['#22324a','#f2f5ee']);sfx.whiff()}
  else{pop(tX,tY-pr,'INCOMPLETE','#9fb3a6');burstParts(tX,tY,6,['#6b3a1d','#3d8a52']);sfx.whiff()}
  if(st.drops>=3){over(null,'drops');return true}
  return false;
}

// ---------- jumping catch (catch mode + defense) ----------
const JD=.5,JCD=1.1;
const airH=()=>st.jumpT>0?Math.sin(Math.PI*(1-st.jumpT/JD)):0;
function doJump(){
  if(st.intro>0||paused)return;
  if(!running||st.mode==='run'||st.jumpT>0||st.jumpCd>0)return;
  if(st.mode==='defense'&&(st.down>0||st.dive>0))return;
  st.jumpT=JD;st.jumpCd=JCD;tone(330,.18,'triangle',.07,1.8);
}
function tickJump(dt){st.jumpT=Math.max(0,st.jumpT-dt);st.jumpCd=Math.max(0,st.jumpCd-dt);
  const b=$('jumpBtn');b.style.setProperty('--cd',(1-st.jumpCd/JCD).toFixed(3));b.classList.toggle('cool',st.jumpCd>0)}
function drawJumpShadow(pr){const h=airH();if(h<=0)return;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(st.x,st.y+pr*.4,pr*(1.1-.3*h),pr*(.5-.15*h),0,0,7);ctx.fill()}

// ---------- game state ----------
const PPY=()=>H/22, PR=()=>Math.max(13,W*0.034), PY0=()=>H*.78;
const TYPES={
  dl:{rs:1.18,sp:.82,lr:.95,ls:.9,nums:[90,91,93,95,97,99],tag:'DL',build:'thick'},
  lb:{rs:1.04,sp:1,lr:1.3,ls:1.12,nums:[50,52,54,55,56,58],tag:'LB',build:'athletic'},
  db:{rs:.86,sp:1.2,lr:.85,ls:1.05,nums:[20,21,23,24,31,33,38],tag:'DB',build:'skinny'}
};

const joy={x:0,y:0,id:null};const joyEl=$('joy'),knob=$('knob');
function joyMove(e){const r=joyEl.getBoundingClientRect(),R=r.width/2-12;
  let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const m=Math.hypot(dx,dy);
  if(m>R){dx*=R/m;dy*=R/m}joy.x=dx/R;joy.y=dy/R;knob.style.transform=`translate(${dx}px,${dy}px)`}
function joyEnd(){joy.id=null;joy.x=joy.y=0;knob.style.transform=''}
joyEl.addEventListener('pointerdown',e=>{joy.id=e.pointerId;joyEl.setPointerCapture(e.pointerId);joyMove(e);e.preventDefault()});

function input(){
  let x=joy.x+((keys.ArrowRight||keys.d)?1:0)-((keys.ArrowLeft||keys.a)?1:0);
  let y=joy.y+((keys.ArrowDown||keys.s)?1:0)-((keys.ArrowUp||keys.w)?1:0);
  const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}
  return Math.hypot(x,y)<.12?{x:0,y:0}:{x,y};
}

const CD=1.15;
function doJuke(){
  if(st&&(st.intro>0||paused))return;
  if(st&&st.mode==='defense')return doDive();
  if(st&&st.mode==='run'){if(running)kickPress();return}
  if(!running||st.cd>0)return;
  const i=input();let dx=i.x,dy=i.y;
  st.cd=st.cdMax;st.jukeHit=false;st.whiffShown=false;
  // straight right/left = spin that way, down-left/down-right = step then dash the other way, anything else = quick juke
  const diag=Math.abs(dx)>.3&&Math.abs(dy)>.3;
  // any right/left juke (even while pushing up to run) is a spin; the body turns the opposite way it moves
  const side=Math.abs(dx)>.3&&dy<=.3;
  if(side){
    const dir=Math.sign(dx);
    st.vx=dir*W*1.65;st.vy=-W*.15;st.jukeT=.34;
    st.move={kind:'spin',dir:-dir,t:0,dur:.34};pop(st.x,st.y-PR()*2.2,'SPIN MOVE','#f2f5ee');
  }else if(diag&&dy>0){
    const dash=Math.sign(dx);
    st.vx=-dash*W*.7;st.vy=W*.08;st.jukeT=.36;
    st.move={kind:'stepdash',dash,t:0,split:.11,dur:.36};pop(st.x,st.y-PR()*2.2,dash<0?'STEP RIGHT, DASH LEFT':'STEP LEFT, DASH RIGHT','#f2f5ee');
  }else{
    if(Math.hypot(dx,dy)<.2){dx=Math.sign(st.vx)||(Math.random()<.5?-1:1);dy=0}
    const m=Math.hypot(dx,dy);dx/=m;dy/=m;
    const burst=W*1.7;st.vx=dx*burst;st.vy=dy*burst;st.jukeT=.22;st.move=null;
  }
  burstParts(st.x,st.y,6,['#f2f5ee','#3d8a52']);
}

function step(dt){
  const ppy=PPY(), pr=PR(), q=st.qtr;
  // ---- player ----
  const i=input(), maxSp=W*.78*st.spdMul*(st.boost>0?1.35:1);
  // push up = run downfield, let go = stop dead, pull down = backpedal
  const idle=i.x===0&&i.y===0;
  const wantRun=i.y<-.1?Math.min(1,-i.y/.7):0;
  st.runAmt+=(wantRun-st.runAmt)*Math.min(1,dt*(wantRun>st.runAmt?6:14));
  const tvy=i.y>0?i.y*maxSp*.7:(st.y>PY0()+2&&wantRun>0?-maxSp*.45*wantRun:0);
  const k=st.jukeT>0?1.5:(idle?22:10);
  st.vx+=(i.x*maxSp-st.vx)*Math.min(1,dt*k);
  st.vy+=(tvy-st.vy)*Math.min(1,dt*k);
  if(st.move){const M=st.move;M.t+=dt;
    if(M.kind==='stepdash'){
      if(M.t<M.split){st.vx=-M.dash*W*.7;st.vy=W*.08}
      else if(!M.dashed){M.dashed=true;st.vx=M.dash*W*1.95;st.vy=W*.12;burstParts(st.x,st.y,8,['#f2f5ee','#3d8a52'])}
    }
    if(M.t>=M.dur)st.move=null}
  st.x+=st.vx*dt;st.y+=st.vy*dt;
  st.x=Math.max(pr,Math.min(W-pr,st.x));st.y=Math.max(H*.6,Math.min(H*.92,st.y));
  const mv=Math.hypot(st.vx,st.vy-maxSp*.6*st.runAmt);
  if(mv>8)st.ang=Math.atan2(st.vy-maxSp*.6*st.runAmt,st.vx);
  st.jukeT=Math.max(0,st.jukeT-dt);if(st.mode==='catch'||st.mode==='rush')tickJump(dt);
  if(st.cd>0)st.cd=Math.max(0,st.cd-dt);
  st.comboT-=dt;if(st.comboT<=0)st.combo=0;if(st.qbT>0)st.qbT-=dt;
  st.boost=Math.max(0,st.boost-dt);st.x2=Math.max(0,st.x2-dt);st.shake=Math.max(0,st.shake-dt*3);
  if(st.boost>0&&Math.random()<.5)st.parts.push({x:st.x+(Math.random()-.5)*pr,y:st.y+pr,vx:0,vy:120,t:0,life:.3,c:'#4fc3f7',s:2.5});

  // ---- field ----
  st.fwd=st.speed*(st.spdMul>1?1.06:1)*(st.boost>0?1.25:1);const fwd=st.fwd*st.runAmt;
  const run=fwd*ppy*dt;st.yards+=fwd*dt;
  if(st.hasBall&&st.yards>=goalYard()){const pts=7*(st.x2>0?2:1);st.score+=pts;st.yards=0;st.qtr++;st.speed+=1.4;
    if(st.mode==='catch'){st.hasBall=false;st.streak=0}
    st.defs.forEach(d=>burstParts(d.x,d.y,6,['#ffb627','#f2f5ee']));st.defs=[];st.pass=null;st.passT=1.6;st.flash=1.4;st.flashPts=pts;sfx.td();st.shake=.6}
  st.spawn-=dt;if(st.spawn<=0){spawnDef();if(q>=3&&Math.random()<.3)spawnDef();st.spawn=Math.max(.45,1.25-q*.14)*(.7+Math.random()*.6)*(st.mode==='catch'?1.25:1)}
  st.itemT-=dt;if(st.itemT<=0){spawnItem();st.itemT=6+Math.random()*5}
  if(st.mode==='catch'&&!st.hasBall){if(!st.pass){st.passT-=dt;if(st.passT<=0)throwPass()}else{st.pass.t+=dt;if(st.pass.t>=st.pass.T&&resolvePass())return}}

  // ---- items ----
  for(const it of st.items){it.y+=run;it.b+=dt*5;
    if(Math.hypot(it.x-st.x,it.y-st.y)<pr*1.9){it.dead=true;sfx.pick();burstParts(it.x,it.y,10,[ITEMS[it.k].c,'#f2f5ee']);
      if(it.k==='boost'){st.boost=ITEMS.boost.t;pop(it.x,it.y,'SPEED','#4fc3f7')}
      if(it.k==='x2'){st.x2=ITEMS.x2.t;pop(it.x,it.y,'DOUBLE POINTS','#ffb627')}
      if(it.k==='pad'){st.pad=true;pop(it.x,it.y,'PADDED UP','#c9d4cc')}}}
  st.items=st.items.filter(it=>!it.dead&&it.y<H+30);

  // ---- defenders ----
  for(const d of st.defs){
    const T=d.T,chaseSp=W*(.36+q*.045)*T.sp, lungeSp=W*(1.35+q*.08)*T.ls, lungeR=pr*5.2*T.lr;

      if(st.pass&&st.pass.cov===d){gx=st.pass.tx-d.x;gy=yardToY(st.pass.ty)-d.y;gd=Math.hypot(gx,gy)||1}

      st.combo++;st.comboT=2;st.jukes++;st.jukeHit=true;st.maxCombo=Math.max(st.maxCombo,st.combo);

      st.cd=Math.min(st.cd,.45); // landing a juke recharges it faster
      if(big){st.ankles++;st.slow=.35;st.shake=.5;sfx.ankles()}else{st.shake=.25;sfx.juke()}
      burstParts(d.x,d.y,big?16:10,big?['#ffb627','#f2f5ee','#3d8a52']:['#f2f5ee','#3d8a52']);
      pop(d.x,d.y,(big?'ANKLES BROKE +':'JUKE +')+pts+(st.combo>1?`  x${st.combo}`:''),'#ffb627');
      continue;
    }
    if(st.mode==='rush'&&st.jumpT>0&&!d.hurdled&&nd<d.r*.9+pr*.85){d.hurdled=true;const pts=3*(st.x2>0?2:1);st.score+=pts;st.hurdles=(st.hurdles||0)+1;pop(d.x,d.y-d.r,'HURDLE +'+pts,'#4fc3f7');burstParts(d.x,d.y,8,['#4fc3f7','#f2f5ee'])}
    if(d.state!=='down'&&st.jumpT<=0&&nd<d.r*.9+pr*.85){
      if(st.pad){st.pad=false;d.dead=true;st.shake=.6;sfx.pad();burstParts(d.x,d.y,14,['#c9d4cc','#f2f5ee']);pop(d.x,d.y,'STIFF ARM','#c9d4cc');
        st.defs.forEach(o=>{if(!o.dead&&Math.hypot(o.x-st.x,o.y-st.y)<pr*4){o.state='down';o.t=.8}});continue}

    }
  }
  st.defs=st.defs.filter(d=>!d.dead&&d.y<H+50);
  if(st.jukeT===0&&st.cd>0&&st.cd<st.cdMax-.22&&!st.jukeHit&&!st.whiffShown){pop(st.x,st.y-pr*2,'WHIFF','#9fb3a6');st.whiffShown=true;sfx.whiff()}

  for(const p of st.pops){p.t+=dt;p.y-=40*dt}st.pops=st.pops.filter(p=>p.t<.9);
  st.flash=Math.max(0,st.flash-dt);
  $('score').textContent=st.score;$('togo').textContent=goalYard()==null?'–':Math.max(0,Math.ceil(goalYard()-st.yards));$('qtr').textContent=st.qtr;
  const jb=$('jukeBtn');jb.style.setProperty('--cd',(1-st.cd/st.cdMax).toFixed(3));jb.classList.toggle('cool',st.cd>0);
}

// top-down footballer: shoulder pads in jersey color, number on the back, helmet forward
// body builds: skinny = kickers/WRs/DBs, athletic = QBs/LBs, thick = RBs/linemen
function drawPlayer(x,y,r,ang,jersey,trim,helmet,num,extra,name,build){
  const B=BUILD[build]||BUILD.athletic,bw=B.w,bd=B.d;
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(x+3,y+5,r*1.2*bw,r*.95*bd,0,0,7);ctx.fill();
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  // arms hang at the sides, thicker on bigger builds
  ctx.fillStyle=jersey;ctx.beginPath();ctx.ellipse(r*.25,-r*1.2*bw,r*.45*bd,r*.24*bw,.3,0,7);ctx.ellipse(r*.25,r*1.2*bw,r*.45*bd,r*.24*bw,-.3,0,7);ctx.fill();
  ctx.fillStyle=jersey;ctx.beginPath();ctx.ellipse(-r*.15,0,r*.8*bd,r*1.3*bw,0,0,7);ctx.fill();
  ctx.strokeStyle=trim;ctx.lineWidth=2;ctx.stroke();
  if(extra)extra(r);
  ctx.save();ctx.translate(-r*.55,0);ctx.rotate(Math.PI/2);
  ctx.fillStyle=trim;ctx.font=`700 ${r*.85}px "Barlow Condensed", sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  // name across the shoulders, number below it (rear view of a top-down runner)
  if(name){ctx.font=`700 ${r*.6}px "Barlow Condensed", sans-serif`;ctx.fillText(num,0,r*.14);
    ctx.font=`700 ${Math.min(r*.34,r*2.3/Math.max(String(name).length,3)*1.6)}px "Barlow Condensed", sans-serif`;ctx.fillText(name,0,-r*.3)}
  else ctx.fillText(num,0,0);
  ctx.restore();
  const hx=name?r*.4:r*.3,hr=name?r*.5:r*.55;
  ctx.fillStyle=helmet;ctx.beginPath();ctx.arc(hx,0,hr,0,7);ctx.fill();
  ctx.fillStyle=jersey;ctx.fillRect(hx-hr*.9,-r*.09,hr*1.8,r*.18);
  ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(hx,0,hr,-.9,.9);ctx.stroke();
  ctx.restore();
}

function drawPass(pr){
  const S=st.skin;if(st.hasBall)return;
  // QB trails you at the bottom
  drawPlayer(W/2,QBY(),pr*.95,-Math.PI/2+(st.qbT>0?-.5:0),S.jersey,S.trim,S.helmet,'1',null,null,'athletic');
  const p=st.pass;if(!p)return;
  const tY=yardToY(p.ty),u=p.t/p.T,R0=pr*2.6*st.hands;
  // landing marker with distance + countdown ring
  ctx.fillStyle='rgba(255,182,39,.14)';ctx.beginPath();ctx.arc(p.tx,tY,R0,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,182,39,.55)';ctx.lineWidth=2;ctx.setLineDash([5,5]);ctx.beginPath();ctx.arc(p.tx,tY,R0,0,7);ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle='#ffb627';ctx.lineWidth=4;ctx.beginPath();ctx.arc(p.tx,tY,R0,-Math.PI/2,-Math.PI/2+Math.PI*2*(1-u));ctx.stroke();

  for(let k=0;k<=24;k++){const v=u+(1-u)*k/24,q=passPos(p,v);k?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)}

  ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.atan2(yardToY(p.ty)-yardToY(p.sy),p.tx-p.sx)+st.yards*.6);
  ctx.fillStyle='#7a4320';ctx.beginPath();ctx.ellipse(0,0,sz,sz*.6,0,0,7);ctx.fill();
  ctx.strokeStyle='#f2f5ee';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-sz*.35,0);ctx.lineTo(sz*.35,0);ctx.stroke();ctx.restore();

function drawField(){
  const ppy=PPY(),py0=PY0();
  ctx.fillStyle='#1f5a32';ctx.fillRect(0,0,W,H);
  // 5-yard bands, positioned straight from yards so they never drift
  const first=Math.floor((st.yards-15)/5)*5;
  for(let L=first;L<st.yards+30;L+=5){
    const y=py0-(L+5-st.yards)*ppy;
    if((L/5)%2===0){ctx.fillStyle='#1a4e2b';ctx.fillRect(0,y,W,ppy*5)}
  }
  for(let L=first;L<st.yards+30;L++){
    const y=py0-(L-st.yards)*ppy;if(y<-20||y>H+20)continue;if(st.mode!=='catch'&&(L<0||L>100))continue;
    ctx.fillStyle='rgba(242,245,238,.55)';
    if(L%5===0)ctx.fillRect(0,y-1,W,2);
    else{ctx.fillRect(W*.3-6,y,12,1.5);ctx.fillRect(W*.7-6,y,12,1.5);ctx.fillRect(4,y,8,1.5);ctx.fillRect(W-12,y,8,1.5)}
    const v=st.mode==='catch'?(st.hasBall?st.ezYard-L:((L%100)+100)%100):L;
    if(v%10===0&&v>0&&v<100){const n=v<=50?v:100-v;ctx.save();ctx.fillStyle='rgba(242,245,238,.5)';
      ctx.font=`700 ${ppy*1.6}px "Barlow Condensed", sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.translate(W*.12,y);ctx.rotate(Math.PI/2);ctx.fillText(n,0,0);ctx.restore();
      ctx.save();ctx.fillStyle='rgba(242,245,238,.5)';ctx.font=`700 ${ppy*1.6}px "Barlow Condensed", sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.translate(W*.88,y);ctx.rotate(-Math.PI/2);ctx.fillText(n,0,0);ctx.restore()}
  }
  // end zone
  const gy=goalYard();const ez=gy==null?-1e9:py0-(gy-st.yards)*ppy;
  if(ez>-ppy*10){ctx.fillStyle='#7d2622';ctx.fillRect(0,ez-ppy*10,W,ppy*10);
    ctx.fillStyle='rgba(242,245,238,.85)';ctx.fillRect(0,ez-2,W,4);
    ctx.save();ctx.fillStyle='rgba(242,245,238,.8)';ctx.font=`${Math.min(W*.11,ppy*3)}px Graduate, Georgia, serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('END ZONE',W/2,ez-ppy*5);ctx.restore()}
  ctx.fillStyle='rgba(242,245,238,.8)';ctx.fillRect(0,0,3,H);ctx.fillRect(W-3,0,3,H);

function draw(){
  const pr=PR();
  ctx.save();
  if(st.shake>0)ctx.translate((Math.random()-.5)*st.shake*14,(Math.random()-.5)*st.shake*14);
  drawField();

  if(st.mode==='catch')drawPass(pr);
  for(const it of st.items){const I=ITEMS[it.k],r=pr*.95,yy=it.y+Math.sin(it.b)*3;
    ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(it.x+2,it.y+r*.9,r*.8,r*.3,0,0,7);ctx.fill();
    ctx.fillStyle=I.c;ctx.beginPath();ctx.arc(it.x,yy,r,0,7);ctx.fill();
    ctx.strokeStyle='#f2f5ee';ctx.lineWidth=2;ctx.stroke();

    if(d.state==='lunge'){ctx.strokeStyle='rgba(242,245,238,.35)';ctx.lineWidth=d.r;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-d.vx*.08,d.y-d.vy*.08);ctx.stroke()}
    const shake=d.state==='windup'?(Math.random()-.5)*3:0;
    ctx.globalAlpha=d.state==='down'?.55:1;
    drawPlayer(d.x+shake,d.y,d.r,d.ang,'#22324a','#f2f5ee','#c9d4cc',d.num,null,null,d.T.build);
    ctx.globalAlpha=1;
    if(d.state==='windup'){ctx.fillStyle='#ff5a4e';ctx.font=`700 ${d.r*1.4}px "Barlow Condensed", sans-serif`;ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillText('!',d.x,d.y-d.r*1.7)}
  }

  for(const p of st.parts){ctx.globalAlpha=1-p.t/p.life;ctx.fillStyle=p.c;ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s)}ctx.globalAlpha=1;

  if(st.jukeT>0){ctx.strokeStyle='rgba(255,182,39,.9)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(st.x,st.y,pr*2.5*st.reach+12,0,7);ctx.stroke()}
  if(st.pad){ctx.strokeStyle='rgba(201,212,204,.8)';ctx.lineWidth=3;ctx.setLineDash([6,4]);ctx.beginPath();ctx.arc(st.x,st.y,pr*1.7,0,7);ctx.stroke();ctx.setLineDash([])}
  // spin moves turn the body a full circle; step-dash leans into the plant
  let spinA=0;const M=st.move;
  if(M&&M.kind==='spin'){const u=Math.min(1,M.t/M.dur);spinA=M.dir*Math.PI*2*(1-(1-u)*(1-u))}
  if(M&&M.kind==='stepdash')spinA=(M.t<M.split?-M.dash:M.dash)*.5;
  if(M&&M.kind==='spin'){ctx.strokeStyle='rgba(242,245,238,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(st.x,st.y,pr*1.6,st.ang+spinA-1.2*M.dir,st.ang+spinA,M.dir<0);ctx.stroke()}
  drawJumpShadow(pr);const jh=airH();
  const S=st.skin;drawPlayer(st.x,st.y-jh*pr*1.4,pr*1.08*(1+.3*jh),st.ang+spinA,S.jersey,S.trim,S.helmet,S.num,!st.hasBall?null:r=>{
    ctx.fillStyle='#6b3a1d';ctx.beginPath();ctx.ellipse(r*.35,r*1.15,r*.38,r*.24,0,0,7);ctx.fill();
    ctx.strokeStyle='#f2f5ee';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(r*.15,r*1.15);ctx.lineTo(r*.55,r*1.15);ctx.stroke();
  },S.name,S.build);

  ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.font='700 20px "Barlow Condensed", sans-serif';
  for(const p of st.pops){ctx.globalAlpha=1-p.t/.9;ctx.fillStyle='rgba(10,14,12,.6)';ctx.fillText(p.txt,p.x+1,p.y+1);ctx.fillStyle=p.col;ctx.fillText(p.txt,p.x,p.y)}
  ctx.globalAlpha=1;
  ctx.restore();

  // status chips (not shaken)
  let cx=10;ctx.font='700 13px "Barlow Condensed", sans-serif';ctx.textBaseline='middle';ctx.textAlign='left';
  const chip=(txt,col,frac)=>{const w=ctx.measureText(txt).width+16;ctx.fillStyle='rgba(10,14,12,.7)';ctx.fillRect(cx,10,w,22);
    ctx.fillStyle=col;ctx.fillRect(cx,30,w*frac,2);ctx.fillText(txt,cx+8,21);cx+=w+6};
  if(st.boost>0)chip('SPEED','#4fc3f7',st.boost/ITEMS.boost.t);
  if(st.x2>0)chip('2X POINTS','#ffb627',st.x2/ITEMS.x2.t);
  if(st.pad)chip('PADDED','#c9d4cc',1);
  if(st.mode==='catch')chip(`DROPS ${st.drops}/3`,st.drops?'#ff5a4e':'#9fb3a6',st.drops/3);
  if(st.combo>1){ctx.textAlign='right';ctx.fillStyle='#ffb627';ctx.font='18px Graduate, Georgia, serif';ctx.fillText(`COMBO x${st.combo}`,W-10,21)}

  if(st.flash>0){
    ctx.globalAlpha=Math.min(1,st.flash);ctx.fillStyle='#ffb627';ctx.textAlign='center';ctx.textBaseline='alphabetic';
    ctx.font=`${Math.min(56,W*.13)}px Graduate, Georgia, serif`;ctx.fillText('TOUCHDOWN',W/2,H*.3);
    ctx.font='600 22px "Barlow Condensed", sans-serif';ctx.fillStyle='#f2f5ee';ctx.fillText(`+${st.flashPts||7} · defense gets faster`,W/2,H*.3+34);
    ctx.globalAlpha=1;
  }
}

// ---------- defense mode: you're the defender, stop the ball carrier ----------
const GOAL=()=>H*.93;
function resetDefense(){
  st.d={lvl:1,lives:st.skin.perk==='pad'?4:3,stops:0,sacks:0,breakups:0,tds:0,play:null,between:1.1};
  st.cdMax=st.skin.perk==='recharge'?.9:1.25;st.dive=0;st.down=0;st.x=W/2;st.y=GOAL()-10*PPY();
}
function mkOff(role,x,y,num,hasBall){return{role,x,y,vx:0,vy:0,ang:Math.PI/2,num,hasBall,r:Math.max(12,W*.032)*(role==='rb'?1.05:1),jcd:.6,jt:0}}
function routeStep(o,dt){const w=o.route[Math.min(o.wi,o.route.length-1)];const gx=w.x-o.x,gy=w.y-o.y,gd=Math.hypot(gx,gy)||1;
  if(gd<o.sp*.12&&o.wi<o.route.length-1)o.wi++;
  o.vx+=(gx/gd*o.sp-o.vx)*Math.min(1,dt*8);o.vy+=(gy/gd*o.sp-o.vy)*Math.min(1,dt*8);
  o.x+=o.vx*dt;o.y+=o.vy*dt;o.x=Math.max(o.r,Math.min(W-o.r,o.x));if(Math.hypot(o.vx,o.vy)>10)o.ang=Math.atan2(o.vy,o.vx)}
function predictRoute(o,T){const c={x:o.x,y:o.y,vx:o.vx,vy:o.vy,route:o.route,wi:o.wi,sp:o.sp,r:o.r};
  for(let t=0;t<T;t+=1/60)routeStep(c,Math.min(1/60,T-t));return c}
function newPlay(){
  const D=st.d,pass=Math.random()<.55;
  st.x=W/2;st.y=GOAL()-10*PPY(); // line up on your own 10st.vx=st.vy=0;st.dive=0;st.down=0;
  if(pass){
    const qb=mkOff('qb',W/2,H*.1,[7,10,12,16][Math.floor(Math.random()*4)],true);
    // two receivers run full routes from opposite sides and never stop; QB picks the open one
    const wrs=[.12,.88].map((side,k)=>{const wr=mkOff('wr',W*side,H*.13,[11,13,17,81,88][Math.floor(Math.random()*5)],false);
      wr.sp=W*(.56+D.lvl*.04);wr.wi=0;
      wr.route=[{x:W*(side<.5?.2+Math.random()*.25:.55+Math.random()*.25),y:H*(.26+Math.random()*.12)},{x:W*(side<.5?.45+Math.random()*.45:.1+Math.random()*.45),y:GOAL()+H*.06}];
      return wr});
    D.play={type:'pass',off:[qb,...wrs],qb,wrs,wr:null,carrier:null,spot:null,tThrow:Math.max(.8,1.05+Math.random()*.5-D.lvl*.05),ball:null,t:0};
  }else{
    const rb=mkOff('rb',W*(.3+Math.random()*.4),H*.14,[20,22,26,28,32][Math.floor(Math.random()*5)],true);
    D.play={type:'run',off:[rb],carrier:rb,t:0};
  }
  const blk=mkOff('ol',W*(.35+Math.random()*.3),H*.2,[64,68,71,74,77][Math.floor(Math.random()*5)],false);
  blk.r*=1.25;blk.cd=0;D.play.blk=blk;D.play.off.push(blk);
  pop(W/2,H*.3,pass?'PASS PLAY':'RUN PLAY','#9fb3a6');
}
function doDive(){
  if(!running||st.cd>0||st.dive>0||st.down>0)return;
  const P=st.d.play;const i=input();let dx=i.x,dy=i.y;
  const tgt=P&&(P.carrier||(P.qb&&P.qb.hasBall&&P.qb)||(P.ball&&{x:P.spot.x,y:P.spot.y}));
  if(Math.hypot(dx,dy)<.2&&tgt){dx=tgt.x-st.x;dy=tgt.y-st.y}
  if(Math.hypot(dx,dy)<.01){dx=0;dy=-1}
  const m=Math.hypot(dx,dy);dx/=m;dy/=m;
  const burst=W*1.55;st.vx=dx*burst;st.vy=dy*burst;st.dive=.3;st.cd=st.cdMax;sfx.juke();
  // ball carrier with a juke ready may read the dive and cut
  const c=P&&P.carrier;
  if(c&&c.jcd<=0&&Math.hypot(c.x-st.x,c.y-st.y)<PR()*8&&Math.random()<Math.min(.85,.5+st.d.lvl*.06))cutAway(c);
}
function cutAway(c){
  const side=Math.sign(c.x-st.x)||(Math.random()<.5?-1:1);
  const edge=(c.x<W*.15&&side<0)||(c.x>W*.85&&side>0)?-side:side;
  c.vx=edge*W*1.7;c.vy=W*.4;c.jt=.2;c.jcd=Math.max(.55,1.2-st.d.lvl*.07);
  pop(c.x,c.y-c.r*2,'CUT','#9fb3a6');burstParts(c.x,c.y,5,['#f2f5ee','#3d8a52']);
}
function endPlay(){const D=st.d;D.play=null;D.between=1.3}
function stopMade(txt,pts){const D=st.d;st.score+=pts;D.stops++;
  if(D.stops%2===0){D.lvl++;setTimeout(()=>running&&pop(W/2,H*.35,`LEVEL ${D.lvl}`,'#4fc3f7'),500)}
  pop(st.x,st.y-PR()*2,`${txt} +${pts}`,'#ffb627');endPlay()}
function stepDefense(dt){
  const D=st.d,pr=PR(),P=D.play,lvl=D.lvl;
  st.cd=Math.max(0,st.cd-dt);st.shake=Math.max(0,st.shake-dt*3);tickJump(dt);
  for(const p of st.parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.92;p.vy*=.92}st.parts=st.parts.filter(p=>p.t<p.life);
  for(const p of st.pops){p.t+=dt;p.y-=40*dt}st.pops=st.pops.filter(p=>p.t<.9);
  // ---- you ----
  const i=input(),maxSp=W*.6*st.spdMul;
  if(st.down>0){st.down-=dt;st.vx*=.82;st.vy*=.82}
  else if(st.dive>0){st.dive-=dt;st.vx*=.985;st.vy*=.985;if(st.dive<=0)st.down=st.skin.perk==='recharge'?.5:.7}
  else{const idle=i.x===0&&i.y===0,k=idle?22:10;st.vx+=(i.x*maxSp-st.vx)*Math.min(1,dt*k);st.vy+=(i.y*maxSp-st.vy)*Math.min(1,dt*k)}
  st.x+=st.vx*dt;st.y+=st.vy*dt;st.x=Math.max(pr,Math.min(W-pr,st.x));st.y=Math.max(H*.05,Math.min(H*.95,st.y));
  if(Math.hypot(st.vx,st.vy)>8)st.ang=Math.atan2(st.vy,st.vx);
  $('togo').textContent=D.stops;$('qtr').textContent=lvl;$('score').textContent=st.score;
  const jb=$('jukeBtn');jb.style.setProperty('--cd',(1-st.cd/st.cdMax).toFixed(3));jb.classList.toggle('cool',st.cd>0||st.down>0);
  if(!P){D.between-=dt;if(D.between<=0)newPlay();return}
  P.t+=dt;
  const tackleR=o=>(pr+o.r)*(st.dive>0?1.2*st.reach:.78);
  // ---- pass play ----
  if(P.type==='pass'){
    const qb=P.qb;
    if(qb.hasBall&&P.carrier!==qb){
      qb.x+=Math.sin(P.t*3)*W*.02*dt;qb.ang=Math.PI/2;
      const pressure=Math.hypot(st.x-qb.x,st.y-qb.y)<pr*4.5;
      if(st.down<=0&&Math.hypot(st.x-qb.x,st.y-qb.y)<tackleR(qb)){D.sacks++;sfx.tackle();st.shake=.6;burstParts(qb.x,qb.y,16,['#22324a','#f2f5ee','#ffb627']);return stopMade('SACK!',7)}
      if(pressure&&P.t>.35&&Math.random()<dt*2.5){P.carrier=qb;qb.jcd=0;pop(qb.x,qb.y-qb.r*2,'SCRAMBLE','#ff5a4e')}
      else if(P.t>=P.tThrow||(pressure&&P.t>.35&&Math.random()<dt*5)){
        // QB leads whichever receiver will be farthest from you
        qb.hasBall=false;let bestPt=null,bestT=0,bestD=-1;
        for(const w of P.wrs){let T=.7,pt=null;
          for(let k=0;k<3;k++){pt=predictRoute(w,T);T=.42+Math.hypot(pt.x-qb.x,pt.y-qb.y)/H*.7}
          pt=predictRoute(w,T);const open=Math.hypot(pt.x-st.x,pt.y-st.y);if(open>bestD){bestD=open;bestPt=pt;bestT=T;P.wr=w}}
        const T=bestT,pt=bestPt;P.spot={x:Math.max(pr,Math.min(W-pr,pt.x)),y:pt.y};
        const d=Math.hypot(P.spot.x-qb.x,P.spot.y-qb.y);
        P.ball={sx:qb.x,sy:qb.y,t:0,T,peak:H*.08+d*.15};sfx.throw();
      }
    }
    for(const w of P.wrs)if(w!==P.carrier)routeStep(w,dt);
    const wr=P.wr;

  for(const p of st.parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.98}st.parts=st.parts.filter(p=>p.t<p.life);
  for(const p of st.pops){p.t+=dt;p.y-=40*dt}st.pops=st.pops.filter(p=>p.t<.9);
  const spd=(1.5+K.dist/24)*(kAcc()?.75:1);
  if(K.phase==='aim'||K.phase==='power'){K.clock-=dt;if(K.clock<=0)return blocked()}
  if(K.phase==='aim'){K.t+=dt;K.aim=Math.sin(K.t*spd)}
  if(K.phase==='power'){K.t+=dt*(.85+K.dist/65)*(K.weather==='rain'?1.25:1);const ph=K.t%2;K.power=ph<1?ph:2-ph}
  if(K.phase==='flight'){K.f.t+=dt/1.35;if(K.f.t>=1){K.f.t=1;finishKick()}}
  if(K.phase==='intro'){K.rt-=dt;if(K.rt<=0){K.phase='aim';K.msg='';$('jukeBtn').textContent='AIM'}}
  if(K.phase==='result'){K.rt-=dt;if(K.rt<=0){if(K.misses>=3)return over(null,'kick');newKick()}}
  $('score').textContent=st.score;$('togo').textContent=K.dist;$('qtr').textContent=K.misses?'✕'.repeat(K.misses):'0';
  const jb=$('jukeBtn');jb.style.setProperty('--cd',(K.phase==='aim'||K.phase==='power')?(K.clock/K.clockMax).toFixed(3):'1');jb.classList.toggle('cool',K.phase==='flight'||K.phase==='result'||K.phase==='intro')}
// pseudo-3D field: s = yards downfield, x = yards left/right, z = yards up
function kGeo(){return{cx:W/2,yB:H*.86,yG:H*.34,ppg:Math.min(W*.13,64)/3.08}}
function kP(g,s,x,z){const d=st.k.dist,q=s/d,qc=Math.min(q,1);
  const y=g.yB-(g.yB-g.yG)*(1-Math.pow(1-qc,1.4))-(q>1?(q-1)*(g.yB-g.yG)*.3:0);
  const sc=1-.7*Math.min(q,1.3),k=g.ppg*sc/.3;return{x:g.cx+x*k,y:y-z*k,sc,k}}
function drawKick(){const K=st.k;if(!K)return;const g=kGeo(),pr=PR(),now=performance.now()/1000;
  ctx.save();if(st.shake>0)ctx.translate((Math.random()-.5)*st.shake*12,(Math.random()-.5)*st.shake*12);
  const sky=ctx.createLinearGradient(0,0,0,g.yG);sky.addColorStop(0,'#05080a');sky.addColorStop(1,K.weather==='snow'?'#2a3532':'#14211c');ctx.fillStyle=sky;ctx.fillRect(-20,-20,W+40,H+40);
  for(const lx of[W*.1,W*.9]){const r=ctx.createRadialGradient(lx,H*.06,0,lx,H*.06,W*.45);r.addColorStop(0,'rgba(255,240,200,.32)');r.addColorStop(1,'rgba(255,240,200,0)');ctx.fillStyle=r;ctx.fillRect(0,0,W,g.yG);
    ctx.fillStyle='#fff6dc';for(let i=0;i<3;i++)for(let j=0;j<2;j++)ctx.fillRect(lx-10+i*7,H*.045+j*6,5,4)}
  // crowd (bounces on game winners)
  const cy=g.yG-H*.09,hype=K.gw?3:0;ctx.fillStyle='#0d1411';ctx.fillRect(0,cy,W,H*.09);
  for(let i=0;i<W;i+=5)for(let j=0;j<3;j++){ctx.fillStyle=['#2b3a33','#3d2f2a','#24332c','#4a3b22'][(i*7+j*3)%4];ctx.fillRect(i,cy+4+j*9+((i*13)%5)-Math.abs(Math.sin(now*8+i))*hype,3,3)}
  ctx.fillStyle=K.weather==='snow'?'#3d6b4a':'#1f5a32';ctx.fillRect(0,g.yG-3,W,H);
  for(let s=0;s<K.dist+10;s+=5){const a=kP(g,s,0,0),b=kP(g,s+5,0,0);if((s/5)%2){ctx.fillStyle=K.weather==='snow'?'#386244':'#1a4e2b';ctx.fillRect(0,b.y,W,a.y-b.y)}}
  const gl=kP(g,K.dist-10,0,0),bl=kP(g,K.dist,0,0);ctx.fillStyle='#7d2622';ctx.fillRect(0,bl.y,W,gl.y-bl.y);
  for(let s=0;s<=K.dist-10;s+=5){const a=kP(g,s,0,0);ctx.fillStyle='rgba(242,245,238,.6)';ctx.fillRect(0,a.y-Math.max(1,a.sc*1.5),W,Math.max(1,a.sc*2.5));
    for(const hx of[-3.08,3.08]){const h=kP(g,s,hx,0);ctx.fillRect(h.x-1,h.y-6*h.sc,2,10*h.sc)}
    const ln=K.dist-10-s;if(ln>0&&ln%10===0&&ln<=50){ctx.font=`700 ${Math.round(18*a.sc+6)}px "Barlow Condensed", sans-serif`;ctx.textAlign='left';ctx.textBaseline='bottom';ctx.fillText(ln,8,a.y-3)}}
  if(K.wind){const d=Math.sign(K.wind),n=Math.abs(K.wind),off=(now*70*d)%W;ctx.strokeStyle='rgba(242,245,238,.4)';ctx.lineWidth=2;
    for(let i=0;i<5;i++){const x=((i*W/5+off)%W+W)%W,y=g.yG-H*.15+(i%2)*10;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+d*n*2.4,y);ctx.stroke()}}
  const posts=()=>{const b=kP(g,K.dist,0,0),k=b.k,L=g.cx-3.08*k,R=g.cx+3.08*k,cb=b.y-3.33*k,top=cb-10*k;
    ctx.strokeStyle='#f2c94c';ctx.lineCap='round';ctx.lineWidth=Math.max(3,k*.35);ctx.beginPath();ctx.moveTo(g.cx,b.y);ctx.lineTo(g.cx,cb);ctx.moveTo(L,cb);ctx.lineTo(R,cb);ctx.moveTo(L,cb);ctx.lineTo(L,top);ctx.moveTo(R,cb);ctx.lineTo(R,top);ctx.stroke();
    ctx.fillStyle='#ff5a4e';const fx=K.wind*.6;for(const px of[L,R]){ctx.beginPath();ctx.moveTo(px,top);ctx.lineTo(px+fx+(K.wind?Math.sign(K.wind)*3:0),top-3);ctx.lineTo(px,top-7);ctx.fill()}
    if(K.ring){const rp=kP(g,K.dist,K.ring.x,K.ring.z),rr=1.1*k,pulse=1+Math.sin(now*5)*.06;
      ctx.strokeStyle=K.f&&K.f.ring&&K.f.t>.95?'#f2f5ee':'#ffb627';ctx.lineWidth=Math.max(2,k*.25);ctx.beginPath();ctx.ellipse(rp.x,rp.y,rr*pulse,rr*1.25*pulse,0,0,7);ctx.stroke();
      ctx.fillStyle='#ffb627';ctx.font='700 11px "Barlow Condensed", sans-serif';ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText('+5',rp.x,rp.y-rr*1.3-2)}};
  const S=st.skin,f=K.f,b0=kP(g,0,K.hash,0);
  if(f){const end=f.res==='SHORT'?Math.min(f.reach,K.dist+4):K.dist+8,s=f.t*end,z=Math.max(0,kZ(f.reach,s));
    const u=s/K.dist;let x=K.hash+f.aimLat*u+f.windLat*u*u;if(f.res==='DOINK'&&s>K.dist)x-=Math.sign(f.lat)*(s-K.dist)*.5;
    const sh=kP(g,s,x,0),bp=kP(g,s,x,z);
    if(s>K.dist){drawKBall(bp,sh,f.t);posts()}else{posts();drawKBall(bp,sh,f.t)}
    drawPlayer(b0.x-pr*.6,g.yB+pr*1.4,pr*1.1,-Math.PI/2,S.jersey,S.trim,S.helmet,S.num,null,S.name,S.build);
  }else{posts();
    drawPlayer(b0.x+pr*1.6,b0.y+pr*.2,pr,Math.PI,'#2b3a33','#f2f5ee','#c9d4cc','4',null,null,'skinny');
    // rushers close in as the clock runs down
    if(K.phase!=='result'){const u=1-K.clock/K.clockMax;for(const side of[-1,1]){const rx=b0.x+side*(W*.42*(1-u)+pr*1.8),ry=b0.y-pr*4*(1-u)-pr*.5;
      drawPlayer(rx,ry,pr*1.05,Math.atan2(b0.y-ry,b0.x-rx),'#22324a','#f2f5ee','#c9d4cc',side<0?'94':'97',null,null,'thick')}}
    drawPlayer(b0.x-pr*.6,b0.y+pr*2.4,pr*1.1,-Math.PI/2,S.jersey,S.trim,S.helmet,S.num,null,S.name,S.build);
    drawKBall(b0,null,0);
    if(K.phase==='aim'||K.phase==='power'){
      const len=Math.min(H*.3,150),A=K.aim*.55;ctx.save();ctx.translate(b0.x,b0.y-10);
      ctx.strokeStyle='rgba(242,245,238,.25)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,len,-Math.PI/2-.55,-Math.PI/2+.55);ctx.stroke();
      ctx.rotate(A);const col=K.phase==='aim'?'#ffb627':'rgba(255,182,39,.55)';ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=4;
      ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(0,-len);ctx.stroke();ctx.beginPath();ctx.moveTo(0,-len-12);ctx.lineTo(-8,-len+2);ctx.lineTo(8,-len+2);ctx.fill();ctx.restore()}
    if(K.phase==='power'){const bw=16,bh=Math.min(H*.42,190),x=W-bw-14,y=g.yB-bh,need=Math.max(0,Math.min(1,(kNeed(K.dist)+(K.weather==='snow'?6:0)-24)/kLeg()));
      ctx.fillStyle='rgba(10,14,12,.75)';ctx.fillRect(x-3,y-3,bw+6,bh+6);
      const gr=ctx.createLinearGradient(0,y+bh,0,y);gr.addColorStop(0,'#3d8a52');gr.addColorStop(.6,'#ffb627');gr.addColorStop(1,'#ff5a4e');ctx.fillStyle=gr;ctx.fillRect(x,y+bh*(1-K.power),bw,bh*K.power);
      ctx.fillStyle='#f2f5ee';ctx.fillRect(x-6,y+bh*(1-need)-1,bw+8,2);ctx.font='700 12px "Barlow Condensed", sans-serif';ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText('MIN',x-9,y+bh*(1-need))}}
  // weather
  if(K.weather==='rain'){ctx.strokeStyle='rgba(160,200,230,.45)';ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<70;i++){const x=(i*73+now*40*(1+K.wind/10))%W,y=(i*131+now*600)%H;ctx.moveTo(x,y);ctx.lineTo(x+K.wind*.4-2,y+12)}ctx.stroke()}
  if(K.weather==='snow'){ctx.fillStyle='rgba(242,245,238,.85)';for(let i=0;i<60;i++){const x=((i*97+now*(20+K.wind*6)+Math.sin(now+i)*12)%W+W)%W,y=(i*151+now*60)%H;ctx.fillRect(x,y,2.5,2.5)}}
  for(const p of st.parts){ctx.globalAlpha=Math.max(0,1-p.t/p.life);ctx.fillStyle=p.c;ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s)}ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  if(K.msg&&(K.phase==='result'||K.phase==='intro')){ctx.font=`${Math.min(W/10,44)}px Graduate, Georgia, serif`;ctx.lineWidth=6;ctx.strokeStyle='#0a0e0c';ctx.strokeText(K.msg,W/2,H*.58);ctx.fillStyle=K.msgCol;ctx.fillText(K.msg,W/2,H*.58);
    if(K.sub){ctx.font='700 19px "Barlow Condensed", sans-serif';ctx.strokeStyle='#0a0e0c';ctx.lineWidth=4;ctx.strokeText(K.sub,W/2,H*.58+28);ctx.fillStyle='#f2f5ee';ctx.fillText(K.sub,W/2,H*.58+28)}}
  ctx.restore();
  // chips
  let cx=10,cy2=10;ctx.font='700 13px "Barlow Condensed", sans-serif';ctx.textBaseline='middle';ctx.textAlign='left';
  const chip=(txt,col)=>{const w=ctx.measureText(txt).width+16;if(cx+w>W-8){cx=10;cy2+=26}ctx.fillStyle='rgba(10,14,12,.75)';ctx.fillRect(cx,cy2,w,22);ctx.fillStyle=col;ctx.fillText(txt,cx+8,cy2+11);cx+=w+6};
  chip(`${K.dist} YD · ${K.hash<0?'LEFT HASH':K.hash>0?'RIGHT HASH':'MIDDLE'}`,'#f2f5ee');
  chip(K.wind?`WIND ${K.wind<0?'←':''} ${Math.abs(K.wind)} MPH ${K.wind>0?'→':''}`:'WIND CALM','#4fc3f7');
  if(K.weather!=='clear')chip(WEATHER[K.weather].n,WEATHER[K.weather].c);
  if(K.gw)chip('GAME WINNER 2X','#ffb627');
  if(K.streak>=2)chip(`${K.streak} STRAIGHT`,'#ffb627');
  if(K.phase==='aim'||K.phase==='power'){const bw=Math.min(W*.5,220),bx=W/2-bw/2,by=H*.93,u=K.clock/K.clockMax;
    ctx.fillStyle='rgba(10,14,12,.75)';ctx.fillRect(bx-2,by-2,bw+4,10);ctx.fillStyle=u<.35?'#ff5a4e':'#f2f5ee';ctx.fillRect(bx,by,bw*u,6);
    ctx.textAlign='center';ctx.fillStyle='rgba(242,245,238,.85)';ctx.font='700 15px "Barlow Condensed", sans-serif';ctx.fillText(K.phase==='aim'?'TAP TO LOCK AIM':'TAP TO KICK',W/2,by-12)}
}
function drawKBall(bp,sh,t){const r=Math.max(3,10*bp.sc);
  if(sh){ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(sh.x,sh.y,r*1.2,r*.45,0,0,7);ctx.fill()}
  ctx.save();ctx.translate(bp.x,bp.y);ctx.rotate(t*20);ctx.fillStyle='#7a4320';ctx.beginPath();ctx.ellipse(0,0,r,r*1.45,0,0,7);ctx.fill();
  ctx.strokeStyle='#f2f5ee';ctx.lineWidth=Math.max(1,r*.15);ctx.beginPath();ctx.moveTo(0,-r*.55);ctx.lineTo(0,r*.55);ctx.stroke();
  for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(-r*.25,i*r*.25);ctx.lineTo(r*.25,i*r*.25);ctx.stroke()}ctx.restore()}

draw();
