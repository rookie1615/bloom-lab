<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Neon Overrun</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: full-bleed night field on canvas; HUD pinned to the top edge; modal panels float centered over the field */
:root{
  --night:#121314; --panel:#1b1d20; --panel-2:#24272b; --line:#3a3e44;
  --ink:#ece7de; --mute:#9e998f; --ember:#f2c14e; --ember-deep:#c98f1a;
  --xp:#8cc965; --blood:#ff5a6a; --moth:#ab9cff;
  --f-display:'Archivo Black','Arial Black',Impact,sans-serif;
  --f-ui:'Barlow Condensed','Arial Narrow',ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--f-ui);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;display:block;touch-action:none;background:var(--night)}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;z-index:2;pointer-events:none;display:flex;flex-direction:column;gap:8px;
  padding-top:calc(env(safe-area-inset-top,0px) + 8px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.xpbar{position:relative;height:14px;border-radius:3px;background:rgba(20,23,38,.85);border:1px solid var(--line);overflow:hidden}
#xpfill{position:absolute;inset:0 auto 0 0;width:0;background:var(--xp);transition:width .12s linear}
#lvl{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;font-weight:700;letter-spacing:.08em;color:#06140f;mix-blend-mode:normal;}
.hudrow{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px}
.hudbtn{pointer-events:auto;width:40px;height:40px;border-radius:3px;border:1px solid var(--line);background:rgba(20,23,38,.8);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.hudbtn:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
#clock{justify-self:center;font-family:var(--f-display);font-size:24px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.counts{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12px;font-weight:600;color:var(--mute);font-variant-numeric:tabular-nums}
.counts b{color:var(--ink);font-weight:700}
.counts .em b{color:var(--ember)}
#slots{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:0}
.subrow{display:flex;gap:8px;align-items:flex-start}
.speedbtn{pointer-events:auto;flex:none;font:inherit;font-size:12px;font-weight:700;letter-spacing:.04em;padding:7px 10px;border-radius:3px;border:1px solid var(--ember);background:rgba(20,23,38,.85);color:var(--ember);cursor:pointer;font-variant-numeric:tabular-nums;}
.speedbtn.on{background:var(--ember);color:#1a1405}
.speedbtn[disabled]{opacity:.45;cursor:not-allowed;}
.speedbtn:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.slot{position:relative;width:28px;height:28px;border-radius:3px;background:rgba(20,23,38,.8);border:1px solid var(--line);display:grid;place-items:center;color:var(--c)}
.slot svg{width:16px;height:16px}
.slot i{position:absolute;right:-3px;bottom:-4px;font-style:normal;font-size:9px;font-weight:700;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:0 3px;line-height:12px}
.slot.evo{border-color:var(--ember);}
.slot.evo i{background:var(--ember);color:#1a0f02;border-color:var(--ember)}
.slot.gap{margin-left:6px}
#bossbar{display:flex;flex-direction:column;gap:3px;align-items:center}
#bossname{font-family:var(--f-display);font-size:15px;letter-spacing:.06em;color:#ffd1d6;}
#bossbar .track{width:min(100%,420px);height:8px;border-radius:3px;background:rgba(20,23,38,.85);border:1px solid #57303a;overflow:hidden}
#bossfill{display:block;height:100%;width:100%;background:var(--blood)}

#banner{position:fixed;left:0;right:0;top:34%;z-index:3;text-align:center;pointer-events:none;font-family:var(--f-display);font-size:clamp(26px,7vw,44px);color:var(--ink);opacity:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#banner.show{animation:ban 2.6s ease forwards}
#banner small{display:block;font-family:var(--f-ui);font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ember);margin-top:4px}
@keyframes ban{0%{opacity:0;transform:translateY(8px) scale(.96)}12%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}

/* Overlay screens */
#ov{position:fixed;inset:0;z-index:5;display:flex;overflow-y:auto;
  padding-block:calc(env(safe-area-inset-top,0px) + 20px) calc(env(safe-area-inset-bottom,0px) + 20px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:rgba(10,10,11,.86)}
.panel{margin:auto;width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ember)}
h1,h2{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;line-height:.95}
h1{font-size:clamp(36px,11vw,64px);letter-spacing:0;text-transform:uppercase;color:var(--ink);}
h2{font-size:clamp(28px,8.5vw,40px);}
.lede{margin:0;color:var(--mute);font-size:15px;line-height:1.5;max-width:36ch}
.btn{font:inherit;font-weight:700;font-size:16px;letter-spacing:.04em;border-radius:3px;padding:14px 18px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .1s,border-color .12s,background .12s}
.btn:hover{border-color:var(--ember)}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.btn.primary{background:var(--ember);color:#1a1405;border-color:var(--ember)}
.btn.primary:hover{background:#ffd36a}
.btn.small{font-size:13px;padding:9px 12px;border-radius:3px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600}
.stat b{font-size:22px;font-variant-numeric:tabular-nums}
.stat.em b{color:var(--ember)}
.hint{font-size:13px;color:var(--mute);line-height:1.5;margin:0}
.hint kbd{font-family:var(--f-ui);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px;color:var(--ink)}

.cards{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:48px minmax(0,1fr);column-gap:12px;row-gap:3px;align-items:center;text-align:left;width:100%;padding:12px 14px;border-radius:3px;background:var(--panel);border:1px solid var(--line);color:var(--ink);font:inherit;cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s;animation:cardin .28s ease backwards}
.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.15s}
@keyframes cardin{from{opacity:0;transform:translateY(10px)}}
.card:hover,.card:focus-visible{border-color:var(--ember);outline:none}
.card .ic{grid-row:span 3;width:48px;height:48px;border-radius:3px;display:grid;place-items:center;color:var(--c);background:var(--panel-2);border:1px solid var(--line)}
.card .ic svg{width:26px;height:26px}
.card .nm{font-weight:700;font-size:16px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card .tag{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:2px 6px;border-radius:3px;background:var(--panel-2);color:var(--mute)}
.card .tag.new{background:var(--ember);color:#1c0e02}
.card .ds{font-size:13px;color:var(--mute);line-height:1.4}
.card .pr{font-size:11px;color:var(--ember);font-weight:600}
.card .key{display:none}
.card.legend{border-color:#ffd166;background:#231f12}
.card.legend .tag{background:#ffd166;color:#1c1402}
.card.legend .nm{color:#ffe7a8}
.card.legend .ic{border-color:#ffd166;}
.slot.legend{border-color:#ffd166;}
.slot.legend i{background:#ffd166;color:#1c1402;border-color:#ffd166}
@media (hover:hover){.card .key{display:inline;margin-left:auto;font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:3px;padding:0 5px}}

.shop{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:12px 14px}
.item h3{margin:0;font-size:15px;font-weight:700}
.item p{margin:0;font-size:12px;color:var(--mute);grid-column:1}
.pips{display:flex;gap:3px;grid-column:1}
.pips i{width:14px;height:4px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--ember);}
.item .btn{grid-column:2;grid-row:1 / span 3;min-width:86px;font-variant-numeric:tabular-nums}
.purse{display:flex;justify-content:space-between;align-items:baseline}
.purse b{font-size:26px;color:var(--ember);font-variant-numeric:tabular-nums}
.build{display:flex;flex-direction:column;gap:6px}
.bi{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:8px 10px}
.bi .ic{width:32px;height:32px;border-radius:3px;display:grid;place-items:center;color:var(--c);background:var(--panel-2)}
.bi .ic svg{width:18px;height:18px}
.bi b{font-size:14px}
.bi small{display:block;color:var(--mute);font-size:11px;line-height:1.35}
.bi em{font-style:normal;font-size:12px;font-weight:700;color:var(--ember);font-variant-numeric:tabular-nums}
.wpicker{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--wa);border-radius:3px;padding:10px}
.wpicker .arr{width:44px;height:44px;border-radius:3px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font:inherit;font-size:22px;cursor:pointer;display:grid;place-items:center;padding:0}
.wpicker .arr[disabled]{opacity:.3;cursor:default}
.wpicker .mid{text-align:center;min-width:0;display:flex;flex-direction:column;gap:2px}
.wpicker .mid span{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--wa)}
.wpicker .mid b{font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--ink)}
.wpicker .mid small{font-size:12px;color:var(--mute)}
.diffs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.dbtn{font:inherit;display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center;padding:9px 6px;border-radius:3px;border:1px solid var(--line);background:var(--panel);color:var(--mute);cursor:pointer}
.dbtn b{font-size:14px;color:var(--ink)}
.dbtn small{font-size:10px;line-height:1.3}
.dbtn.on{border-color:var(--r);}
.dbtn.on b{color:var(--r)}
.dbtn:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
.skin{font:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border:1px solid var(--line);border-bottom:3px solid var(--r);border-radius:3px;background:var(--panel);color:var(--ink);cursor:pointer;min-width:0}
.skin img{width:56px;height:56px;image-rendering:auto}
.skin span{font-size:12px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.skin.sel{border-color:var(--ember);background:var(--panel-2)}
.skin.locked{cursor:default;opacity:.55}
.skin.locked img{filter:brightness(0)}
.skin:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.panel>.topback{position:sticky;top:0;align-self:flex-end;z-index:3;margin-bottom:-50px;padding:9px 14px;font-size:15px;background:var(--panel-2)}
.panel:has(>.topback)>div:nth-child(2){padding-right:100px;min-height:40px}
.item.mega{border-left:3px solid #c77dff}
.item.mega h3{color:#e2c6ff}
.item.ultra{border-left:3px solid var(--line);opacity:.6}
.item.ultra.on{border-left-color:var(--wa);opacity:1}
.item.ultra.on h3{color:var(--wa)}
.ubadge{grid-column:2;grid-row:1 / span 2;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:5px 8px;border:1px solid var(--line);border-radius:3px;color:var(--mute)}
.item.ultra.on .ubadge{border-color:var(--wa);color:var(--wa)}
.reels{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.45fr);gap:6px 8px}
.reels .phase{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.reels .phase b{color:var(--ember)}
.reels .phase.live{color:var(--ink)}
.reels .ri{font-size:15px;gap:6px;padding:0 8px;justify-content:flex-start}
.reels .ri span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.reels .ri svg{width:16px;height:16px}
.reels .ri img{width:26px;height:26px;flex:none}
.reels .waiting .ri{justify-content:center;font-size:26px;opacity:.5}
.reels .waiting .reel{opacity:.55}
.sec{display:flex;flex-direction:column;gap:8px}
.sec>h3{margin:0;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.wpick{display:grid;grid-template-columns:30px minmax(0,1fr);gap:2px 8px;align-items:center;text-align:left;padding:9px 10px;border-radius:3px;background:var(--panel);border:1px solid var(--line);color:var(--ink);font:inherit;cursor:pointer}
.wpick .ic{grid-row:span 2;width:30px;height:30px;border-radius:3px;display:grid;place-items:center;background:var(--panel-2);color:var(--c)}
.wpick .ic svg{width:18px;height:18px}
.wpick b{font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wpick small{font-size:11px;color:var(--mute);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wpick.sel{border-color:var(--ember);}
.wpick:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.gear{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--r,var(--line));border-radius:3px;padding:9px 10px}
.gear .ic{width:36px;height:36px;border-radius:3px;display:grid;place-items:center;background:var(--panel-2);color:var(--r,var(--mute))}
.gear .ic svg{width:20px;height:20px}
.gear b{font-size:14px;color:var(--r,var(--mute))}
.gear .slotname{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.gear ul{margin:2px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:3px 10px;font-size:12px;color:var(--ink)}
.gear ul li{font-variant-numeric:tabular-nums}
.ench{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--r,var(--line));border-radius:3px;padding:9px 12px;font-size:13px;color:var(--mute);line-height:1.4}
.ench b{color:var(--r,var(--ink))}
.crates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.crates .btn{flex-direction:column;gap:2px;padding:12px 10px;font-size:14px}
.crates .btn .cic{display:grid;place-items:center}.crates .btn .cic svg{width:22px;height:22px}
.crates .btn.wide{grid-column:1 / -1}
.crates .btn small{font-size:11px;font-weight:600;opacity:.8}
.reveal{animation:reveal .45s cubic-bezier(.2,1.2,.4,1) backwards;border-color:var(--r);border-width:2px;}
@keyframes reveal{0%{opacity:0;transform:scale(.6) rotate(-4deg)}100%{opacity:1;transform:none}}
.rarlab{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--r)}
.vs{font-size:12px;color:var(--mute)}
.reel{position:relative;height:168px;overflow:hidden;border-radius:3px;background:var(--panel);border:1px solid var(--line);-webkit-mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent);mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent)}
.strip{will-change:transform}
.ri{height:56px;display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-display);font-size:21px;color:var(--r);padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri svg{width:22px;height:22px;flex:none}
.mark{position:absolute;left:0;right:0;top:56px;height:56px;border-block:2px solid var(--ember);pointer-events:none;background:rgba(94,231,255,.06)}
.reel.landed .mark{border-color:var(--r);background:rgba(255,255,255,.04);animation:landp .5s ease}
@keyframes landp{0%{transform:scaleY(1.25)}100%{transform:none}}
.phase{display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.phase b{color:var(--ember)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:12px;font-weight:700;padding:7px 11px;border-radius:3px;border:1px solid var(--line);background:var(--panel);color:var(--mute);cursor:pointer}
.chip.on{border-color:var(--r,var(--ember));color:var(--r,var(--ember));background:var(--panel-2);}
.chip:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.chip[disabled]{opacity:.4;cursor:default}
.bagrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--r);border-radius:3px;padding:7px 8px 7px 10px}
.bagrow b{display:block;font-size:13px;color:var(--r);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bagrow small{display:block;font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bagrow .btn{padding:7px 9px;font-size:12px;border-radius:3px}
.sold{text-align:center;font-weight:700;color:var(--ember);font-size:15px}
.codeform{display:flex;gap:8px}
.codeform input{flex:1;min-width:0;font:inherit;font-size:16px;font-weight:600;letter-spacing:.2em;padding:10px 12px;border-radius:3px;border:1px solid var(--line);background:var(--panel);color:var(--ink);-webkit-user-select:text;user-select:text}
.codeform input:focus{outline:2px solid var(--ember);outline-offset:1px;border-color:var(--ember)}
.toggle{background:none;border:0;color:var(--mute);font:inherit;font-size:13px;cursor:pointer;padding:6px;text-decoration:underline;text-underline-offset:3px;align-self:center}
@media (prefers-reduced-motion:reduce){.card{animation:none}#banner.show{animation-duration:3s}}
</style>
</head>
<body>


<canvas id="c" aria-label="Game field"></canvas>
<div id="hud" hidden>
  <div class="xpbar"><div id="xpfill"></div><span id="lvl">LV 1</span></div>
  <div class="hudrow">
    <button class="hudbtn" id="pauseBtn" aria-label="Pause"><svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><rect x="2" y="1" width="3.5" height="12" rx="1"/><rect x="8.5" y="1" width="3.5" height="12" rx="1"/></svg></button>
    <div id="clock">00:00</div>
    <div class="counts"><div><b id="kills">0</b> kills</div><div class="em"><b id="embers">0</b> credits</div></div>
  </div>
  <div class="subrow"><div id="slots"></div><button id="speedBtn" class="speedbtn" hidden></button></div>
  <div id="bossbar" hidden><span id="bossname"></span><div class="track"><i id="bossfill"></i></div></div>
</div>
<div id="banner"></div>
<div id="ov"></div>

<script>
'use strict';
/* ================= helpers ================= */
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[Math.random()*a.length|0];

  if(gap&&now-(sfxLast[n]||0)<gap)return;sfxLast[n]=now;
  switch(n){
    case 'hit':tone(220+Math.random()*60,0.05,'square',0.018,-120);break;
    case 'shoot':tone(660,0.06,'triangle',0.02,-300);break;
    case 'thorn':tone(900,0.05,'sawtooth',0.012,-500);break;
    case 'zap':tone(1400,0.09,'sawtooth',0.018,-1100);break;
    case 'pulse':tone(140,0.25,'sine',0.06,-80);break;
    case 'gem':tone(700+Math.min(p||0,30)*28,0.06,'sine',0.03);break;
    case 'hurt':tone(120,0.18,'sawtooth',0.05,-60);break;
    case 'level':[523,659,784,1046].forEach((f,i)=>tone(f,0.16,'triangle',0.045,0,i*0.07));break;
    case 'chest':[392,523,659,784,1046,1318].forEach((f,i)=>tone(f,0.2,'triangle',0.04,0,i*0.06));break;
    case 'boss':tone(70,1.2,'sawtooth',0.06,-20);tone(105,1.2,'sawtooth',0.04,-30,0.1);break;
    case 'heal':tone(523,0.12,'sine',0.04,260);break;
    case 'die':tone(300,0.8,'triangle',0.06,-260);break;
    case 'click':tone(500,0.04,'square',0.02);break;
    case 'tick':tone(1500,0.025,'square',0.014);break;
    case 'warn':tone(880,0.1,'square',0.03);tone(880,0.1,'square',0.03,0,0.18);break;
    case 'mortar':tone(70,0.4,'sawtooth',0.06,-30);break;
    case 'laser':tone(1800,0.4,'sawtooth',0.04,-1500);tone(90,0.4,'sine',0.06,-40);break;
    case 'sing':tone(80,0.9,'sine',0.07,180);break;
    case 'boom':tone(170,0.14,'square',0.03,-110);break;
    case 'shield':tone(1300,0.16,'triangle',0.045,-700);break;
    case 'legend':[523,784,1046,1568].forEach((f,i)=>tone(f,0.3,'triangle',0.05,0,i*0.09));break;
  }
}

function makePlayer(){
  return {x:0,y:0,r:12,hp:100,maxHp:100,lvl:1,xp:0,xpNext:xpNeed(1),weapons:[],passives:{},fx:1,fy:0,iframe:0,pending:0,anim:0,hurtT:0,moving:false,
    legend:{},orbT:2,singT:3,shieldT:0,forceLegend:false,revive:((save.shop.revive||0)>0?1:0)+MG('mlife'),rerolls:save.shop.reroll||0,might:1,haste:1,area:1,armor:0,regen:0,magnet:70,speed:150,amount:0};
}
function xpNeed(l){return Math.floor(5+(l-1)*4+Math.pow(l-1,1.62));}
function recalc(){
  const p=P.passives,sh=save.shop;
  P.might=1+0.12*(p.tinder||0)+0.06*(sh.might||0);
  P.haste=Math.pow(0.92,p.clock||0);
  P.area=1+0.12*(p.lens||0);
  P.armor=(p.bark||0);
  P.regen=0.4*(p.sap||0);
  P.magnet=70*(1+0.35*(p.lodestone||0)+0.2*(sh.reach||0));
  P.speed=150*(1+0.1*(p.boots||0)+0.05*(sh.swift||0));
  P.amount=(p.twin||0)+(hasU('alien')?1:0);
  const G=gearTotals();P.might*=1+G.dmg;P.haste*=Math.max(0.5,1-G.cd);P.armor+=G.armor;P.regen+=G.regen;P.magnet*=1+G.pick;P.speed*=1+G.spd;P.crit=G.crit;P.xpMul=(1+G.xp)*(hasU('grow')?1.3:1);if(hasU('grow'))P.regen+=1;P.might*=1+0.25*MG('mdmg');P.speed*=1+0.2*MG('mspeed');if(MG('mmag'))P.magnet*=2;
  const L=P.legend||{};if(L.overdrive){P.might*=1.6;P.speed*=1.2;}if(L.chrono){P.haste*=0.7;P.amount+=1;}
  const mx=100+20*(p.heart||0)+12*(sh.vital||0)+(L.aegis?50:0)+G.hp+60*MG('mhp');
  if(mx>P.maxHp)P.hp+=mx-P.maxHp;P.maxHp=mx;P.hp=Math.min(P.hp,P.maxHp);
}
const getW=id=>P.weapons.find(w=>w.id===id);

/* ================= spatial grid ================= */
const CS=64;const grid=new Map();
const gk=(cx,cy)=>(cx+32768)*65536+(cy+32768);
function gridBuild(){grid.clear();for(const e of enemies){if(e.dead)continue;const k=gk(Math.floor(e.x/CS),Math.floor(e.y/CS));let b=grid.get(k);if(!b){b=[];grid.set(k,b);}b.push(e);}}
function query(x,y,r,out){out.length=0;r+=48;const x0=Math.floor((x-r)/CS),x1=Math.floor((x+r)/CS),y0=Math.floor((y-r)/CS),y1=Math.floor((y+r)/CS);for(let cx=x0;cx<=x1;cx++)for(let cy=y0;cy<=y1;cy++){const b=grid.get(gk(cx,cy));if(b)for(let i=0;i<b.length;i++)out.push(b[i]);}return out;}
function nearest(x,y,n,maxD){const best=[];const md=maxD*maxD;for(const e of enemies){if(e.dead)continue;const d=(e.x-x)**2+(e.y-y)**2;if(d>md)continue;if(best.length<n){best.push([d,e]);best.sort((a,b)=>a[0]-b[0]);}else if(d<best[n-1][0]){best[n-1]=[d,e];best.sort((a,b)=>a[0]-b[0]);}}return best.map(b=>b[1]);}
function randomNear(x,y,maxD){let c=0,pickE=null;const md=maxD*maxD;for(const e of enemies){if(e.dead)continue;if((e.x-x)**2+(e.y-y)**2<md){c++;if(Math.random()*c<1)pickE=e;}}return pickE;}
const spawnR=()=>Math.hypot(W,H)/2/VS+50;

/* ================= effects ================= */
function burst(x,y,col,n,spd,glowy){for(let i=0;i<n&&parts.length<700;i++){const a=rand(0,TAU),s=rand(spd*0.3,spd);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(0.3,0.7),max:0.7,size:rand(1.5,3.5),col,glow:!!glowy});}}
function dmgNum(x,y,v,crit,col){if(nums.length>70)nums.shift();nums.push({x:x+rand(-6,6),y,v,crit,life:0.7,col:col||(crit?'#ffe27a':'#f1e7d4')});}
function banner(title,sub){const b=$('banner');b.innerHTML=title+(sub?`<small>${sub}</small>`:'');b.classList.remove('show');void b.offsetWidth;b.classList.add('show');}

/* ================= combat ================= */
function hurt(e,d,kx,ky,src){
  if(e.dead)return;const en=(src&&run.ench&&src===run.starter)?run.ench:null;
  if(en&&en.id==='power')d*=1+0.15*en.tier;
  const crit=Math.random()<0.06+(P.crit||0)+(en&&en.id==='crit'?0.08*en.tier:0);if(crit)d*=2;d=Math.max(1,Math.round(d));
  e.hp-=d;e.flash=0.09;run.dmg+=d;if(hasU('frost')&&!e.boss)e.slow=Math.max(e.slow,1);
  if(!e.boss){const k=e.elite?0.25:1;e.kx+=kx*k;e.ky+=ky*k;}
  dmgNum(e.x,e.y-e.r,d,crit);sfx('hit');
  if(en){const t=en.tier;
    if(en.id==='burn'){e.burn=3;e.burnDmg=Math.max(1,d*0.12*t);}
    else if(en.id==='frost')e.slow=Math.max(e.slow,1+0.6*t);
    else if(en.id==='vamp'){if(Math.random()<0.06*t)heal(1+t);}
    else if(en.id==='blast'){if(Math.random()<0.12*t&&booms.length<150)booms.push({x:e.x,y:e.y,d:d*0.5/P.might});}
    else if(en.id==='shock'){if(Math.random()<0.12*t){let o=null,bd=150;for(const q of query(e.x,e.y,150,Q2)){if(q===e||q.dead)continue;const dd=Math.hypot(q.x-e.x,q.y-e.y);if(dd<bd){bd=dd;o=q;}}if(o){fx.push({k:'arc',pts:jag([[e.x,e.y],[o.x,o.y]]),t:0,dur:0.15});hurt(o,d*0.6,0,0);}}}}
  if(e.hp<=0)kill(e);
}
function kill(e){
  e.dead=true;run.kills++;
  if(P.legend.boom&&!e.boss&&booms.length<150)booms.push({x:e.x,y:e.y,d:Math.max(30,e.maxHp*0.6)});
  burst(e.x,e.y,e.col,e.boss?60:e.elite?24:8,e.boss?260:140,false);
  burst(e.x,e.y,e.eye,e.boss?30:3,120,true);
  dropXP(e.x,e.y,e.xp);
  const r=Math.random();
  if(e.boss){for(let i=0;i<60;i++)gems.push({type:'gold',x:e.x+rand(-60,60),y:e.y+rand(-60,60),val:1,spd:0,mag:false});gems.push({type:'chest',big:true,x:e.x,y:e.y,val:0,spd:0,mag:false});gems.push({type:'heart',x:e.x+30,y:e.y,val:0,spd:0,mag:false});run.boss=null;$('bossbar').hidden=true;shake=14;banner(e.name+' destroyed','The grid goes quiet');sfx('chest');}
  else if(e.elite){gems.push({type:'chest',big:false,x:e.x,y:e.y,val:0,spd:0,mag:false});for(let i=0;i<10;i++)gems.push({type:'gold',x:e.x+rand(-30,30),y:e.y+rand(-30,30),val:1,spd:0,mag:false});shake=Math.max(shake,6);}
  else if(r<0.012)gems.push({type:'heart',x:e.x,y:e.y,val:0,spd:0,mag:false});
  else if(r<0.016)gems.push({type:'magnet',x:e.x,y:e.y,val:0,spd:0,mag:false});
  else if(hasU('midas')&&r<0.016)gems.push({type:'chest',big:false,x:e.x,y:e.y,val:0,spd:0,mag:false});
  else if(r<0.13)gems.push({type:'gold',x:e.x,y:e.y,val:1,spd:0,mag:false});
}
function dropXP(x,y,v){
  if(gems.length>380){for(let i=gems.length-1,c=0;i>=0&&c<60;i--,c++){const g=gems[i];if(g.type==='xp'&&!g.mag&&Math.abs(g.x-x)<220&&Math.abs(g.y-y)<220){g.val+=v;return;}}}
  gems.push({type:'xp',x:x+rand(-4,4),y:y+rand(-4,4),val:v,spd:0,mag:false});
}
function heal(n){const before=P.hp;P.hp=Math.min(P.maxHp,P.hp+n);const h=Math.round(P.hp-before);if(h>0){dmgNum(P.x,P.y-24,'+'+h,false,'#7dffa8');}}
function damagePlayer(d){
  if(P.iframe>0||state!=='play')return;
  if(P.legend.aegis&&P.shieldT<=0){P.shieldT=5;P.iframe=0.6;fx.push({k:'ring',x:P.x,y:P.y,r:40,t:0,dur:0.35,col:'#5ee7ff',follow:true});sfx('shield');return;}
  d=Math.max(1,Math.round(d*DF().dmg*(1+0.25*wDiff())*(1+run.t/420+(run.t>420?(run.t-420)/90:0))-P.armor));
  d=Math.min(d,Math.ceil(P.maxHp*0.55));P.hp-=d;P.iframe=0.45;P.hurtT=0.25;shake=Math.max(shake,7);sfx('hurt');
  dmgNum(P.x,P.y-20,d,false,'#ff5a6a');
  if(P.hp<=0)die();
}
function die(){
  if(P.revive>0){P.revive--;P.hp=P.maxHp*0.5;P.iframe=2.5;
    query(P.x,P.y,260,Q);for(const e of Q.slice()){if(e.dead)continue;const dx=e.x-P.x,dy=e.y-P.y,d=Math.hypot(dx,dy)||1;if(d<260)hurt(e,e.boss?200:999,dx/d*500,dy/d*500);}
    fx.push({k:'ring',x:P.x,y:P.y,r:260,t:0,dur:0.6,col:'#ffd27a',follow:true});banner('Backup Core','Systems rebooted');sfx('chest');return;}
  P.hp=0;sfx('die');burst(P.x,P.y,'#5ee7ff',40,220,true);endRun(false);
}
function shoot(o){projs.push({x:o.x,y:o.y,vx:Math.cos(o.a)*o.spd,vy:Math.sin(o.a)*o.spd,a:o.a,r:o.r,dmg:o.dmg*P.might,pierce:o.pierce,life:o.life,kind:o.kind,col:o.col,src:o.src,hit:new Set()});}
function eshoot(x,y,a,spd,r,dmg){if(eprojs.length<240)eprojs.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r,dmg,life:5});}
function jag(pts){const out=[];for(let i=0;i<pts.length-1;i++){const [x0,y0]=pts[i],[x1,y1]=pts[i+1];out.push([x0,y0]);const segs=4;for(let s=1;s<segs;s++){const t=s/segs;const nx=-(y1-y0),ny=x1-x0,l=Math.hypot(nx,ny)||1;const o=rand(-10,10);out.push([x0+(x1-x0)*t+nx/l*o,y0+(y1-y0)*t+ny/l*o]);}}out.push(pts[pts.length-1]);return out;}

/* ================= weapons ================= */
function updateWeapons(dt){
  for(const w of P.weapons){
    const s=WEAPONS[w.id].st(w.lvl,w.evo);const hk=P.haste*(w.id===run.starter&&run.ench&&run.ench.id==='haste'?1-0.1*run.ench.tier:1);
    switch(w.id){
      case 'bolt':{w.t-=dt;if(w.t<=0){const n=s.count+P.amount;const tg=nearest(P.x,P.y,1,520);if(tg.length){w.t=w.cdMax=s.cd*hk;for(let i=0;i<n;i++){const e=tg[0];const a=Math.atan2(e.y-P.y,e.x-P.x)+(i-(n-1)/2)*0.1;shoot({x:P.x,y:P.y-6,a,spd:s.spd,r:s.r*(w.evo?P.area:1),dmg:s.dmg,pierce:s.pierce,life:1.4,kind:w.evo?'spear':'bolt',col:'#5ee7ff',src:'bolt'});}sfx('shoot');}else w.t=0.1;}break;}
      case 'halo':{const n=s.count;w.ang+=s.spin*dt;const R=s.rad*P.area,orr=s.r*P.area;w.orbs.length=0;
        for(let i=0;i<n;i++){const a=w.ang+i*TAU/n;const ox=P.x+Math.cos(a)*R,oy=P.y+Math.sin(a)*R;w.orbs.push(ox,oy);query(ox,oy,orr,Q);
          for(const e of Q){if(e.dead)continue;const dx=e.x-ox,dy=e.y-oy;const rr=orr+e.r;if(dx*dx+dy*dy<rr*rr&&run.t-(e.haloT||-9)>0.42){e.haloT=run.t;const d=Math.hypot(dx,dy)||1;hurt(e,s.dmg*P.might,dx/d*140,dy/d*140,'halo');if(w.evo)e.slow=1.2;}}}
        break;}
      case 'pulse':{w.t-=dt;if(w.t<=0){w.t=w.cdMax=s.cd*hk;const R=s.rad*P.area;fx.push({k:'ring',x:P.x,y:P.y,r:R,t:0,dur:0.42,col:w.evo?'#d6e6ff':'#7aa8ff',follow:true});query(P.x,P.y,R,Q);let caught=0;
        for(const e of Q.slice()){if(e.dead)continue;const dx=e.x-P.x,dy=e.y-P.y,d=Math.hypot(dx,dy)||1;if(d<R+e.r){hurt(e,s.dmg*P.might,dx/d*280,dy/d*280,'pulse');caught++;}}
        if(w.evo&&caught)heal(Math.min(caught,8)*0.75);sfx('pulse');}break;}
      case 'chain':{w.t-=dt;if(w.t<=0){const strikes=w.evo?2:1;let any=false;
        for(let k=0;k<strikes;k++){const first=nearest(P.x,P.y,strikes,430)[k];if(!first)break;any=true;let cur=first;const hit=new Set();const pts=[[P.x,P.y-16]];
          for(let j=0;j<=s.jumps;j++){hit.add(cur);pts.push([cur.x,cur.y]);hurt(cur,s.dmg*P.might,0,0,'chain');burst(cur.x,cur.y,'#fff3a8',3,90,true);
            let best=null,bd=170*P.area;query(cur.x,cur.y,bd,Q);for(const e of Q){if(e.dead||hit.has(e))continue;const d=Math.hypot(e.x-cur.x,e.y-cur.y);if(d<bd){bd=d;best=e;}}
            if(!best)break;cur=best;}
          fx.push({k:'arc',pts:jag(pts),t:0,dur:0.2});}
        w.t=any?s.cd*hk:0.2;if(any)w.cdMax=w.t;if(any)sfx('zap');}break;}
      case 'thorn':{w.t-=dt;if(w.t<=0){w.t=w.cdMax=s.cd*hk;const n=s.count+P.amount*(w.evo?2:1);const ce=nearest(P.x,P.y,1,520)[0];const base=ce?Math.atan2(ce.y-P.y,ce.x-P.x):Math.atan2(P.fy,P.fx);
        for(let i=0;i<n;i++){const a=w.evo?base+i*TAU/n:base+(n===1?0:(i/(n-1)-0.5)*s.spread);shoot({x:P.x,y:P.y-4,a,spd:380,r:4*P.area,dmg:s.dmg,pierce:s.pierce,life:0.75,kind:'thorn',col:'#7dffb0',src:'thorn'});}
        sfx('thorn');}break;}
      case 'pyre':{w.t-=dt;if(w.t<=0){w.t=w.cdMax=s.cd*hk;const n=s.count+P.amount;
        for(let i=0;i<n;i++){let tx,ty;const e=nearest(P.x,P.y,1,280)[0];if(e){tx=e.x+rand(-24,24);ty=e.y+rand(-24,24);}else{const a=rand(0,TAU),d=rand(70,200);tx=P.x+Math.cos(a)*d;ty=P.y+Math.sin(a)*d;}
          pyres.push({sx:P.x,sy:P.y-10,x:P.x,y:P.y,tx,ty,fly:0,flyDur:0.45+i*0.08,r:s.rad*P.area,dmg:s.dmg*P.might,dur:s.dur,t:0,tick:0,landed:false,evo:w.evo});}}break;}
    }
  }
}

function updateLegends(dt){
  const L=P.legend;
  if(L.orbital){P.orbT-=dt;if(P.orbT<=0){let best=null,bh=0;for(const e of enemies){if(e.dead)continue;if((e.x-P.x)**2+(e.y-P.y)**2>520*520)continue;if(e.hp>bh){bh=e.hp;best=e;}}
    if(best){P.orbT=3.5*P.haste;const R=95*P.area,x=best.x,y=best.y;fx.push({k:'laser',x,y,r:R,t:0,dur:0.55});query(x,y,R,Q);
      for(const e of Q.slice()){if(e.dead)continue;if((e.x-x)**2+(e.y-y)**2<(R+e.r)**2)hurt(e,300*P.might,0,0);}shake=Math.max(shake,6);sfx('laser');burst(x,y,'#ffd166',24,260,true);}else P.orbT=0.3;}}
  if(L.singularity){P.singT-=dt;if(P.singT<=0){const e=randomNear(P.x,P.y,320);if(e){P.singT=6*P.haste;sings.push({x:e.x,y:e.y,r:150*P.area,t:0,dur:3,tick:0});sfx('sing');}else P.singT=0.4;}}
  for(const g of sings){g.t+=dt;g.tick-=dt;const hitNow=g.tick<=0;if(hitNow)g.tick=0.25;const list=query(g.x,g.y,g.r,Q).slice();
    for(const e of list){if(e.dead)continue;const dx=g.x-e.x,dy=g.y-e.y,d=Math.hypot(dx,dy)||1;if(d>g.r+e.r)continue;if(!e.boss){const pull=Math.min(d,260*dt);e.x+=dx/d*pull;e.y+=dy/d*pull;}if(hitNow)hurt(e,22*P.might,0,0);}
    if(g.t>=g.dur){for(const e of list){if(e.dead)continue;if((e.x-g.x)**2+(e.y-g.y)**2<(g.r*0.7)**2)hurt(e,160*P.might,0,0);}fx.push({k:'ring',x:g.x,y:g.y,r:g.r*0.8,t:0,dur:0.4,col:'#ff5cf0'});burst(g.x,g.y,'#ff5cf0',30,280,true);shake=Math.max(shake,5);}}
  compact(sings,g=>g.t<g.dur);
  if(booms.length){const list=booms.splice(0,40);for(const b of list){const R=55*P.area;fx.push({k:'ring',x:b.x,y:b.y,r:R,t:0,dur:0.25,col:'#ff9a3c'});burst(b.x,b.y,'#ff9a3c',4,160,true);
    for(const e of query(b.x,b.y,R,Q).slice()){if(e.dead)continue;if((e.x-b.x)**2+(e.y-b.y)**2<(R+e.r)**2)hurt(e,b.d*P.might,0,0);}}sfx('boom');}
  if(P.shieldT>0)P.shieldT-=dt;
}
/* ================= spawning ================= */
function pickType(t){
  const pool=[['moth',t<120?10:6]];
  if(t>40)pool.push(['slug',6]);
  if(t>110)pool.push(['husk',5]);
  if(t>170)pool.push(['wisp',5]);
  if(t>230)pool.push(['spitter',2.2]);
  if(t>300)pool.push(['brute',1.6+(t>450?1.4:0)]);
  let sum=0;for(const p of pool)sum+=p[1];let r=Math.random()*sum;for(const p of pool){r-=p[1];if(r<=0)return p[0];}return 'moth';
}

    for(const w of P.weapons){if(w.id==='halo')continue;const f=w.cdMax?clamp(1-w.t/w.cdMax,0,1):1;const col=WEAPONS[w.id].color;
      const bx=P.x-bw/2,by=P.y-34-row*(bh+3);

/* ================= choices ================= */
function choices(n){
  const opts=[];
  for(const w of P.weapons)if(w.lvl<5&&!w.evo)opts.push({kind:'w',id:w.id,wt:3});
  if(P.weapons.length<6)for(const id of WIDS)if(!getW(id))opts.push({kind:'w',id,wt:2.2});
  const owned=PIDS.filter(id=>P.passives[id]).length;
  for(const id of PIDS){const l=P.passives[id]||0;if(l>=PASSIVES[id].max)continue;if(!l&&owned>=6)continue;opts.push({kind:'p',id,wt:l?2.6:1.6});}
  if(MG('mlegend')||P.weapons.some(w=>w.evo))for(const id in LEGENDS)if(!P.legend[id])opts.push({kind:'l',id,wt:1.1});
  const out=[];
  while(out.length<n&&opts.length){let sum=0;for(const o of opts)sum+=o.wt;let r=Math.random()*sum;let idx=0;for(;idx<opts.length;idx++){r-=opts[idx].wt;if(r<=0)break;}idx=Math.min(idx,opts.length-1);out.push(opts.splice(idx,1)[0]);}
  if(!out.length){out.push({kind:'heal'},{kind:'gold'});}
  return out;
}
function choiceInfo(c){
  if(c.kind==='l'){const d=LEGENDS[c.id];return {icon:ICON[d.icon],color:'#ffd166',name:d.name,tag:'Legendary',isNew:false,legend:true,desc:d.desc,pr:''};}
  if(c.kind==='w'){const d=WEAPONS[c.id],w=getW(c.id),nl=w?w.lvl+1:1;let pr='';
    if(nl===5){const pn=PASSIVES[d.pair].name;pr=P.passives[d.pair]?`Ready to evolve into ${d.evo} from a crate.`:`At max level, evolves with ${pn}.`;}
    else if(!w)pr=`Evolves with ${PASSIVES[d.pair].name}.`;
    return {icon:ICON[c.id],color:d.color,name:d.name,tag:w?`Lv ${w.lvl} → ${nl}`:'New',isNew:!w,desc:d.ups[nl-1],pr};}
  if(c.kind==='p'){const d=PASSIVES[c.id],l=P.passives[c.id]||0;const wid=PAIR_OF[c.id];let pr='';if(wid&&getW(wid)&&!getW(wid).evo)pr=`Pairs with ${WEAPONS[wid].name} for its evolution.`;
    return {icon:ICON[c.id],color:d.color,name:d.name,tag:l?`Lv ${l} → ${l+1}`:'New',isNew:!l,desc:d.desc,pr};}
  if(c.kind==='heal')return {icon:ICON.heart,color:'#ff7a8a',name:'Repair Kit',tag:'Repair',desc:'Repair 40 health.',pr:''};
  return {icon:ICON.coin,color:'#5ee7ff',name:'Credit Cache',tag:'Credits',desc:'+15 credits for the shop.',pr:''};
}
function applyChoice(c){
  if(c.kind==='w'){const w=getW(c.id);if(w)w.lvl++;else addWeapon(c.id);}
  else if(c.kind==='p'){P.passives[c.id]=(P.passives[c.id]||0)+1;recalc();}
  else if(c.kind==='l'){P.legend[c.id]=true;recalc();if(c.id==='aegis')heal(50);sfx('legend');}
  else if(c.kind==='heal')heal(40);
  else run.gold+=15;
  refreshSlots();
}

    case 'rollskin':openSkinCrate();break;
    case 'skinequip':save.skin=b.dataset.id;persist();sfx('level');showArmory();break;
    case 'diff':save.diff=+b.dataset.k;persist();showMenu();break;
    case 'adminoff':save.admin=false;save.embers=save.realEmbers|0;if((save.world|0)>(save.worldMax|0))save.world=save.worldMax|0;persist();showShop();break;
    case 'wprev':save.world=Math.max(0,(save.world|0)-1);persist();if(save.world<=wMax()){initMenuScene();}showMenu();break;
    case 'wnext':save.world=Math.min(WORLDS.length-1,(save.world|0)+1);persist();if(save.world<=wMax()){initMenuScene();}showMenu();break;
    case 'starter':save.starter=b.dataset.id;persist();showArmory();break;
    case 'rollgear':openGearCrate(b.dataset.slot);break;
    case 'rollench':openEnchCrate();break;
    case 'keep':resolveRoll('keep');break;
    case 'bag':resolveRoll('bag');break;
    case 'scrap':resolveRoll('sell');break;
    case 'skipspin':finishRoll();break;
    case 'stopauto':stopAuto('Stopped');break;
    case 'autoroll':save.autoroll=!save.autoroll;persist();showArmory();break;
    case 'stoplegend':save.stopLegend=save.stopLegend===false;persist();showArmory();break;
    case 'again':openGearCrate(b.dataset.slot);break;
    case 'againench':openEnchCrate();break;
    case 'autosell':{const k=b.dataset.k;save.autosell[k]=!save.autosell[k];persist();showArmory();break;}
    case 'bagequip':{const i=+b.dataset.i,it=save.bag[i];if(it){save.bag.splice(i,1);const old=save.gear[it.slot];save.gear[it.slot]=it;if(old)save.bag.push(old);persist();sfx('level');showArmory();}break;}
    case 'bagsell':{const i=+b.dataset.i,it=save.bag[i];if(it){save.bag.splice(i,1);save.embers+=RAR[it.r].scrap;persist();showArmory();}break;}
    case 'sellrar':{const r=+b.dataset.r;let g=0;save.bag=save.bag.filter(it=>{if(it.r===r){g+=RAR[r].scrap;return false;}return true;});save.embers+=g;persist();showArmory();break;}
    case 'sellall':{save.embers+=save.bag.reduce((t,it)=>t+RAR[it.r].scrap,0);save.bag=[];persist();showArmory();break;}
    case 'menu':if(autoRun)autoRun.stopped=true;autoRun=null;clearSpin();pendingRoll=null;initMenuScene();showMenu();break;
    case 'buy':{const it=SHOP.find(s=>s.id===b.dataset.id);const c=shopCost(it);if(save.embers>=c&&(save.shop[it.id]||0)<it.max){save.embers-=c;save.shop[it.id]=(save.shop[it.id]||0)+1;persist();sfx('level');showShop();}break;}
    case 'choose':{const c=curChoices[+b.dataset.i];if(c){applyChoice(c);resumeOrNext();}break;}
    case 'reroll':if(P.rerolls>0){P.rerolls--;curChoices=choices(hasU('honor')?4:3);showLevelUp(false);}break;
    case 'resume':resumeOrNext();break;
    case 'quit':endRun(false);break;
    case 'mute':save.muted=!save.muted;persist();if(state==='pause'){state='play';showPause();}else showMenu();break;
    case 'endless':run.endless=true;run.nextBoss=run.t+90;state='play';showHUD(true);closeOv();lastT=performance.now();banner('They keep coming','Endless');break;
  }
});
$('pauseBtn').addEventListener('click',()=>showPause());
ov.addEventListener('submit',ev=>{ev.preventDefault();const inp=$('admincode');const v=(inp&&inp.value||'').trim();
  if(v==='53487'){save.admin=true;save.realEmbers=save.embers;persist();sfx('legend');showShop();}
  else{const m=$('codemsg');if(m)m.textContent='Code not recognized.';sfx('hurt');if(inp)inp.value='';}});
function toggleSpeed(){if(state!=='play'||run.t<300)return;
  if(!run.fastOwned){if(!save.admin&&run.gold-run.goldBanked<45)return;if(!save.admin)run.gold-=45;run.fastOwned=true;run.speed=2;banner('Time 2×','45 credits spent');sfx('level');}
  else{run.speed=run.speed===2?1:2;sfx('click');}}
$('speedBtn').addEventListener('click',toggleSpeed);
window.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  keys[e.code]=true;
  if(e.code==='Escape'||e.code==='KeyP'){if(state==='play')showPause();else if(state==='pause')resumeOrNext();}
  if(state==='levelup'&&/^Digit[1-4]$/.test(e.code)){const i=+e.code.slice(5)-1;const c=curChoices[i];if(c){applyChoice(c);resumeOrNext();}}
  if(e.code==='KeyF')toggleSpeed();
  if(e.code.startsWith('Arrow')&&state==='play')e.preventDefault();
});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;joy.active=false;if(state==='play')showPause();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')showPause();});
cv.addEventListener('pointerdown',e=>{if(state!=='play'||joy.active)return;joy.active=true;joy.id=e.pointerId;joy.ox=joy.x=e.clientX;joy.oy=joy.y=e.clientY;try{cv.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();});
cv.addEventListener('pointermove',e=>{if(!joy.active||e.pointerId!==joy.id)return;joy.x=e.clientX;joy.y=e.clientY;const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.hypot(dx,dy);if(d>70){joy.ox=joy.x-dx/d*70;joy.oy=joy.y-dy/d*70;}});
const endJoy=e=>{if(e.pointerId===joy.id){joy.active=false;joy.id=null;}};
cv.addEventListener('pointerup',endJoy);cv.addEventListener('pointercancel',endJoy);
document.addEventListener('contextmenu',e=>{if(state==='play')e.preventDefault();});

/* ================= loop ================= */
function initMenuScene(){
  curWorld=clamp(save.world|0,0,wMax());
  P=makePlayer();recalc();run={t:0,kills:0,gold:0,goldBanked:0,earned:0,spawnAcc:0,nextElite:9999,evIdx:EVENTS.length,boss:null,endless:false,won:true,nextBoss:1e9,dmg:0,combo:0,comboT:0,chestQ:[]};
  hazards=[];sings=[];booms=[];enemies=[];projs=[];eprojs=[];gems=[];pyres=[];fx=[];parts=[];nums=[];cam.x=0;cam.y=0;
  for(let i=0;i<14;i++){const a=rand(0,TAU),d=rand(170,360);const e=spawnEnemy(pick(['moth','moth','moth','wisp','slug']),false,Math.cos(a)*d,Math.sin(a)*d);e.orb=a;e.od=d;}
}
function menuTick(dt){
  P.anim+=dt*0.3;
  for(const e of enemies){e.anim+=dt;e.orb+=dt*(e.type==='wisp'?0.35:0.18);const d=e.od+Math.sin(e.anim*0.7+e.seed)*30;const nx=Math.cos(e.orb)*d,ny=Math.sin(e.orb)*d;e.face=nx<e.x?-1:1;e.x=nx;e.y=ny;}
}
let lastT=performance.now();
function frame(now){
  let dt=(now-lastT)/1000;lastT=now;if(!(dt>0))dt=0;dt=Math.min(dt,0.05);
  if(state==='play'){const steps=run.speed===2?2:1;for(let k=0;k<steps&&state==='play';k++)update(dt);if(run)updateHUD();}
  else if(state==='menu'||state==='shop'){if(!run||run.t===0)menuTick(dt);}
  if(state==='play'||state==='menu'||state==='shop'){const k=1-Math.exp(-dt*9);cam.x+=(P.x-cam.x)*k;cam.y+=(P.y-cam.y)*k;}
  if(shake>0)shake=Math.max(0,shake-dt*30);
  render();
  requestAnimationFrame(frame);
}
initMenuScene();showMenu();requestAnimationFrame(frame);
</script>
